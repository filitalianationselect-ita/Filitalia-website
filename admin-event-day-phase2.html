<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FIL-ITALIA Admin · Roma Phase 2</title>
<style>
:root{--bg:#edf2f7;--card:#fff;--ink:#17233a;--muted:#6d788a;--line:#d6deea;--blue:#274f8f;--green:#17784a;--greenbg:#e5f5ec;--amber:#9a6410;--amberbg:#fff3d6;--red:#a33b42;--shadow:0 14px 36px rgba(32,54,87,.10)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:#dfe8f3;border-right:1px solid var(--line);padding:22px 16px}.brand{font-weight:900;font-size:19px;margin-bottom:28px}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:11px;color:#425067}.nav .active{background:white;color:var(--blue);font-weight:800}.main{padding:26px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.crumb{color:var(--muted);font-size:13px}h1{margin:4px 0 0;font-size:30px}.preview{background:var(--amberbg);color:var(--amber);padding:9px 12px;border-radius:999px;font-weight:800;font-size:12px}.hero,.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.hero{padding:20px;margin:18px 0}.meta{color:var(--muted);margin-top:8px;font-size:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{border:1px solid var(--line);padding:14px;border-radius:14px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:25px}.workspace{display:grid;grid-template-columns:390px 1fr;gap:16px}.head{padding:16px;border-bottom:1px solid var(--line)}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.filters button{border:1px solid var(--line);background:white;padding:7px 10px;border-radius:999px;font-size:12px}.filters .active{background:#e8eff9;color:var(--blue);font-weight:800}.list{padding:10px;display:grid;gap:8px}.player{padding:12px;border:1px solid transparent;border-radius:14px;background:#f7f9fc;cursor:pointer}.player.active{border-color:#8da8cf;background:#e9f0fa}.player small{color:var(--muted)}.pill{float:right;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}.done{background:var(--greenbg);color:var(--green)}.pending{background:var(--amberbg);color:var(--amber)}.detail{padding:20px}.profile{display:flex;justify-content:space-between;gap:14px;padding-bottom:16px;border-bottom:1px solid var(--line)}.profile h2{margin:0 0 4px}.profile p{margin:0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;padding:9px 12px;border-radius:10px;font-weight:750;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}.info{border:1px solid var(--line);border-radius:13px;padding:12px}.info span{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.tasks{display:grid;gap:9px}.task{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:13px;padding:12px}.task button{border:1px solid var(--line);background:white;border-radius:9px;padding:8px 10px;font-weight:800}.task button.on{background:var(--greenbg);color:var(--green)}.notes{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;padding:11px;margin-top:12px}.editor{display:none;margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#f8fafc}.editor.open{display:block}.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.editor input,.editor select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px}.mobilebar{display:none}
@media(max-width:900px){.app{display:block}.side{display:none}.main{padding:14px}.top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.workspace{grid-template-columns:1fr}.profile{flex-direction:column}.mobilebar{display:flex;position:sticky;bottom:0;background:#17233a;padding:10px;gap:8px;z-index:10}.mobilebar button{flex:1;border:0;border-radius:10px;padding:12px;font-weight:850}.mobilebar .check{background:#dff5e8;color:#176d46}.mobilebar .shirt{background:#e8eff9;color:#274f8f}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand">FIL-ITALIA<small>Management</small></div><div class="nav"><button>Dashboard</button><button class="active">🏀 Eventi</button><button>👥 Giocatori</button><button>📝 Registrazioni</button><button>✉️ Email</button><button>💳 Pagamenti</button></div></aside>
<main class="main"><div class="top"><div><div class="crumb">Eventi / Roma 2026</div><h1>Talent ID Camp Roma</h1></div><div class="preview">FASE 2 · ANTEPRIMA NON PUBBLICATA</div></div>
<section class="hero"><strong>FIL-EURO Talent ID Camp</strong><div class="meta">📅 5 agosto 2026 · 15:00–20:00 &nbsp; 📍 Stella Azzurra Roma</div><div class="stats"><div class="stat"><span>Iscritti</span><strong id="statTotal">0</strong></div><div class="stat"><span>Pagati</span><strong id="statPaid">0</strong></div><div class="stat"><span>Check-in</span><strong id="statCheck">0</strong></div><div class="stat"><span>Maglie consegnate</span><strong id="statShirt">0</strong></div></div></section>
<section class="workspace"><div class="panel"><div class="head"><input id="search" class="search" placeholder="Cerca giocatore, email, categoria..."><div class="filters"><button class="active" data-filter="all">Tutti</button><button data-filter="pending">Da pagare</button><button data-filter="checked">Arrivati</button><button data-filter="U12">U12</button><button data-filter="U16">U16</button></div></div><div id="players" class="list"></div></div><div id="detail" class="panel"></div></section>
</main></div><div class="mobilebar"><button class="check" onclick="quickToggle('checked')">✓ Check-in</button><button class="shirt" onclick="quickToggle('shirtDone')">👕 Maglia</button></div>
<script src="data/admin-registrations-roma.js"></script>
<script>
const storageKey='filitaliaRomaAdminPhase2';
let data=JSON.parse(localStorage.getItem(storageKey)||'null')||window.FILITALIA_ROMA_REGISTRATIONS||[];
let selected=data[0]?.id||null,filter='all';
const save=()=>localStorage.setItem(storageKey,JSON.stringify(data));
function visible(p,q){return (filter==='all'||filter===p.cat||filter===p.status||(filter==='checked'&&p.checked))&&(`${p.name} ${p.email} ${p.cat} ${p.year}`).toLowerCase().includes(q)}
function renderList(){const q=document.getElementById('search').value.toLowerCase();const rows=data.filter(p=>visible(p,q));document.getElementById('players').innerHTML=rows.map(p=>`<div class="player ${p.id===selected?'active':''}" onclick="selectPlayer(${p.id})"><span class="pill ${p.checked?'done':'pending'}">${p.checked?'Arrivato':'Da registrare'}</span><strong>${p.name}</strong><br><small>${p.cat} · ${p.year} · Maglia ${p.shirt}</small></div>`).join('')||'<div style="padding:28px;color:#6d788a">Nessun partecipante trovato</div>'}
function task(label,key,p,paid=false){const on=paid?p.status==='paid':!!p[key];return `<div class="task"><strong>${label}</strong><button class="${on?'on':''}" onclick="toggleTask('${key}',${p.id},${paid})">${on?'✓ Fatto':'Segna fatto'}</button></div>`}
function renderDetail(){const p=data.find(x=>x.id===selected);if(!p){document.getElementById('detail').innerHTML='';return}document.getElementById('detail').innerHTML=`<div class="detail"><div class="profile"><div><h2>${p.name}</h2><p>${p.cat} · ${p.year} · ${p.status==='paid'?'Pagamento verificato':'Pagamento in attesa'}</p></div><div class="actions"><button class="btn" onclick="toggleEditor()">✎ Modifica</button><button class="btn" onclick="sendEmail(${p.id})">✉️ Email</button></div></div><div class="info-grid"><div class="info"><span>Email</span><strong>${p.email}</strong></div><div class="info"><span>Genitore</span><strong>${p.parent}</strong></div><div class="info"><span>Taglia maglia</span><strong>${p.shirt}</strong></div><div class="info"><span>Certificato</span><strong>${p.certificate?'Presente':'Mancante'}</strong></div></div><div class="tasks">${task('Pagamento verificato','status',p,true)}${task('Certificato medico','certificate',p)}${task('Check-in','checked',p)}${task('Maglia consegnata','shirtDone',p)}${task('Presenza confermata','present',p)}</div><textarea class="notes" placeholder="Note rapide..." onchange="saveNotes(${p.id},this.value)">${p.notes||''}</textarea><div id="editor" class="editor"><div class="edit-grid"><input id="eName" value="${p.name}"><input id="eEmail" value="${p.email}"><input id="eParent" value="${p.parent}"><select id="eShirt"><option ${p.shirt==='S'?'selected':''}>S</option><option ${p.shirt==='M'?'selected':''}>M</option><option ${p.shirt==='L'?'selected':''}>L</option><option ${p.shirt==='XL'?'selected':''}>XL</option><option ${p.shirt==='XXL'?'selected':''}>XXL</option></select></div><button class="btn primary" style="margin-top:10px" onclick="saveEdit(${p.id})">Salva modifiche</button></div></div>`}
function selectPlayer(id){selected=id;renderList();renderDetail()}
function toggleTask(key,id,paid){const p=data.find(x=>x.id===id);if(paid)p.status=p.status==='paid'?'pending':'paid';else p[key]=!p[key];save();renderAll()}
function saveNotes(id,value){data.find(x=>x.id===id).notes=value;save()}
function toggleEditor(){document.getElementById('editor').classList.toggle('open')}
function saveEdit(id){const p=data.find(x=>x.id===id);p.name=eName.value.trim();p.email=eEmail.value.trim();p.parent=eParent.value.trim();p.shirt=eShirt.value;save();renderAll()}
function sendEmail(id){const p=data.find(x=>x.id===id);location.href=`mailto:${p.email}?subject=${encodeURIComponent('FIL-ITALIA · Talent ID Camp Roma')}`}
function quickToggle(key){if(selected)toggleTask(key,selected,false)}
function updateStats(){statTotal.textContent=data.length;statPaid.textContent=data.filter(x=>x.status==='paid').length;statCheck.textContent=data.filter(x=>x.checked).length;statShirt.textContent=data.filter(x=>x.shirtDone).length}
function renderAll(){renderList();renderDetail();updateStats()}
search.addEventListener('input',renderList);document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;renderList()});renderAll();
</script>
</body></html>
