<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIL-ITALIA Admin · Demo</title>
<style>
:root{--nav:#14223a;--nav2:#1f3559;--white:#fff;--muted:#aebbd0;--accent:#79a9f3}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef2f7}.shell{height:100%;display:grid;grid-template-rows:auto 1fr}.topbar{background:var(--nav);color:var(--white);display:flex;align-items:center;justify-content:space-between;gap:18px;padding:13px 18px;box-shadow:0 8px 24px rgba(15,28,48,.22);z-index:2}.brand{display:flex;align-items:center;gap:11px;min-width:max-content}.logo{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:#10213c;font-weight:950}.brand strong{display:block}.brand small{color:var(--muted)}.tabs{display:flex;gap:7px;background:var(--nav2);padding:5px;border-radius:13px}.tab{border:0;border-radius:9px;padding:9px 13px;background:transparent;color:var(--muted);font-weight:800;cursor:pointer}.tab.active{background:var(--white);color:#1d3e72}.status{font-size:12px;color:var(--muted);text-align:right}.viewport{position:relative;min-height:0}.page{position:absolute;inset:0;width:100%;height:100%;border:0;background:#eef2f7;display:none}.page.active{display:block}.mobile-select{display:none;width:100%;padding:10px;border-radius:10px;border:0;font-weight:800}
@media(max-width:760px){.topbar{align-items:flex-start;flex-direction:column;padding:11px 12px}.tabs{display:none}.mobile-select{display:block}.status{display:none}.brand{width:100%}.shell{grid-template-rows:auto 1fr}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><div class="logo">FI</div><div><strong>FIL-ITALIA Admin</strong><small>Anteprima di lavoro</small></div></div>
    <nav class="tabs" aria-label="Sezioni admin">
      <button class="tab active" type="button" data-page="event">🏀 Gestione Roma</button>
      <button class="tab" type="button" data-page="email">✉️ Centro Email</button>
    </nav>
    <select id="mobileSelect" class="mobile-select" aria-label="Sezione admin"><option value="event">🏀 Gestione Roma</option><option value="email">✉️ Centro Email</option></select>
    <div class="status">DEMO SEPARATA<br>nessuna modifica al sito pubblico</div>
  </header>
  <main class="viewport">
    <iframe id="eventPage" class="page active" src="admin-roma-demo.html" title="Gestione evento Roma"></iframe>
    <iframe id="emailPage" class="page" src="admin-email-demo.html" title="Centro Email FIL-ITALIA"></iframe>
  </main>
</div>
<script>
(function(){
  const tabs=[...document.querySelectorAll('[data-page]')];
  const pages={event:document.getElementById('eventPage'),email:document.getElementById('emailPage')};
  const mobile=document.getElementById('mobileSelect');
  function show(name){
    Object.entries(pages).forEach(([key,page])=>page.classList.toggle('active',key===name));
    tabs.forEach(tab=>tab.classList.toggle('active',tab.dataset.page===name));
    mobile.value=name;
    try{history.replaceState(null,'','#'+name)}catch(_){ }
  }
  tabs.forEach(tab=>tab.addEventListener('click',()=>show(tab.dataset.page)));
  mobile.addEventListener('change',()=>show(mobile.value));
  show(location.hash==='#email'?'email':'event');
})();
</script>
</body>
</html>
