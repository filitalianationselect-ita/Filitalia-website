name: Diagnose Preview DB Push

on:
  push:
    branches:
      - agent/player-registry-dedupe
    paths:
      - '.github/workflows/diagnose-preview-db-push.yml'

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: filitalia-preview
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PREVIEW_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PREVIEW_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PREVIEW_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Link Preview project
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Capture db push safely
        id: diag
        shell: bash
        run: |
          set +e
          OUTPUT=$(supabase db push 2>&1)
          CODE=$?
          set -e
          SAFE="$OUTPUT"
          if [[ -n "$SUPABASE_ACCESS_TOKEN" ]]; then SAFE=${SAFE//${SUPABASE_ACCESS_TOKEN}/REDACTED}; fi
          if [[ -n "$SUPABASE_DB_PASSWORD" ]]; then SAFE=${SAFE//${SUPABASE_DB_PASSWORD}/REDACTED}; fi
          if [[ -n "$PROJECT_REF" ]]; then SAFE=${SAFE//${PROJECT_REF}/REDACTED}; fi
          MIGRATION=$(printf '%s\n' "$SAFE" | grep -Ei 'applying migration' | tail -n 1 | sed -E 's/.*[Aa]pplying migration[[:space:]]+//; s/\.sql.*$//' || true)
          [[ -n "$MIGRATION" ]] || MIGRATION="unknown-migration"
          ERROR_LINE=$(printf '%s\n' "$SAFE" | grep -Eiv 'try rerunning|with --debug' | grep -Ei 'error:|failed|sqlstate|does not exist|already exists|permission denied|syntax error|invalid' | tail -n 1 || true)
          [[ -n "$ERROR_LINE" ]] || ERROR_LINE=$(printf '%s\n' "$SAFE" | tail -n 1)
          ERROR_SLUG=$(printf '%s' "$ERROR_LINE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-48)
          [[ -n "$ERROR_SLUG" ]] || ERROR_SLUG="unknown-error"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "migration=$MIGRATION" >> "$GITHUB_OUTPUT"
          echo "error_slug=$ERROR_SLUG" >> "$GITHUB_OUTPUT"
      - name: Publish migration diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.diag.outputs.code }}
          MIGRATION: ${{ steps.diag.outputs.migration }}
          ERROR_SLUG: ${{ steps.diag.outputs.error_slug }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CODE" == "0" ]]; then
            STATE=success
            CONTEXT="filitalia/preview-db/success"
          else
            STATE=failure
            CONTEXT="filitalia/preview-db/${MIGRATION}/${ERROR_SLUG}"
          fi
          CONTEXT=$(printf '%s' "$CONTEXT" | cut -c1-95)
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"$CONTEXT\",\"description\":\"Preview DB migration diagnostic\"}"
          [[ "$STATE" == success ]]
