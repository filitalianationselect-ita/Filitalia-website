name: Production Backend Preflight

on:
  push:
    branches:
      - agent/admin-panel-demo
    paths:
      - .github/production-preflight-trigger

permissions:
  contents: read
  statuses: write

jobs:
  preflight:
    name: Production Supabase dry-run only
    runs-on: ubuntu-latest
    environment: filitalia-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PRODUCTION_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PRODUCTION_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PRODUCTION_PROJECT_REF }}
      EXPECTED_PROJECT_REF: exwykgaotochaguizxxt

    steps:
      - name: Checkout release branch
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4

      - name: Check production access token
        id: access_token
        if: ${{ steps.checkout.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_PRODUCTION_ACCESS_TOKEN mancante"; exit 1; }

      - name: Check production DB password
        id: db_password
        if: ${{ steps.access_token.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: test -n "$SUPABASE_DB_PASSWORD" || { echo "SUPABASE_PRODUCTION_DB_PASSWORD mancante"; exit 1; }

      - name: Check production project ref
        id: project_ref
        if: ${{ steps.db_password.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: test -n "$PROJECT_REF" || { echo "SUPABASE_PRODUCTION_PROJECT_REF mancante"; exit 1; }

      - name: Verify production project identity
        id: project_match
        if: ${{ steps.project_ref.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: '[[ "$PROJECT_REF" == "$EXPECTED_PROJECT_REF" ]] || { echo "SUPABASE_PRODUCTION_PROJECT_REF non corrisponde al progetto produzione"; exit 1; }'

      - name: Install Supabase CLI
        id: cli
        if: ${{ steps.project_match.outcome == 'success' }}
        continue-on-error: true
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Link production project
        id: link
        if: ${{ steps.cli.outcome == 'success' }}
        continue-on-error: true
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Dry-run pending production migrations
        id: dry_run
        if: ${{ steps.link.outcome == 'success' }}
        continue-on-error: true
        run: supabase db push --dry-run

      - name: Publish preflight status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          ACCESS_TOKEN: ${{ steps.access_token.outcome }}
          DB_PASSWORD: ${{ steps.db_password.outcome }}
          PROJECT_REF_CHECK: ${{ steps.project_ref.outcome }}
          PROJECT_MATCH: ${{ steps.project_match.outcome }}
          CLI: ${{ steps.cli.outcome }}
          LINK: ${{ steps.link.outcome }}
          DRY_RUN: ${{ steps.dry_run.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          STAGE="success"
          STATE="success"
          DESCRIPTION="Production preflight passed"
          if [[ "$CHECKOUT" != "success" ]]; then STAGE="checkout"; STATE="failure"; DESCRIPTION="Checkout failed";
          elif [[ "$ACCESS_TOKEN" != "success" ]]; then STAGE="missing-access-token"; STATE="failure"; DESCRIPTION="Missing SUPABASE_PRODUCTION_ACCESS_TOKEN";
          elif [[ "$DB_PASSWORD" != "success" ]]; then STAGE="missing-db-password"; STATE="failure"; DESCRIPTION="Missing SUPABASE_PRODUCTION_DB_PASSWORD";
          elif [[ "$PROJECT_REF_CHECK" != "success" ]]; then STAGE="missing-project-ref"; STATE="failure"; DESCRIPTION="Missing SUPABASE_PRODUCTION_PROJECT_REF";
          elif [[ "$PROJECT_MATCH" != "success" ]]; then STAGE="wrong-project-ref"; STATE="failure"; DESCRIPTION="Production project ref mismatch";
          elif [[ "$CLI" != "success" ]]; then STAGE="cli"; STATE="failure"; DESCRIPTION="Supabase CLI setup failed";
          elif [[ "$LINK" != "success" ]]; then STAGE="link"; STATE="failure"; DESCRIPTION="Supabase production link failed";
          elif [[ "$DRY_RUN" != "success" ]]; then STAGE="dry-run"; STATE="failure"; DESCRIPTION="Production migration dry-run failed";
          fi
          CONTEXT="filitalia/production-preflight/$STAGE"
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"$CONTEXT\",\"description\":\"$DESCRIPTION\"}"
          if [[ "$STATE" != "success" ]]; then exit 1; fi
