name: Production Backend Preflight

on:
  push:
    branches:
      - agent/admin-panel-demo
    paths:
      - .github/production-preflight-trigger

permissions:
  contents: read
  statuses: write

jobs:
  preflight:
    name: Production Supabase dry-run only
    runs-on: ubuntu-latest
    environment: filitalia-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PRODUCTION_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PRODUCTION_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PRODUCTION_PROJECT_REF }}
      EXPECTED_PROJECT_REF: exwykgaotochaguizxxt
    steps:
      - name: Checkout release branch
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4

      - name: Validate production credentials
        id: validate
        if: ${{ steps.checkout.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_PRODUCTION_ACCESS_TOKEN mancante"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "SUPABASE_PRODUCTION_DB_PASSWORD mancante"; exit 1; }
          test -n "$PROJECT_REF" || { echo "SUPABASE_PRODUCTION_PROJECT_REF mancante"; exit 1; }
          [[ "$PROJECT_REF" == "$EXPECTED_PROJECT_REF" ]] || { echo "SUPABASE_PRODUCTION_PROJECT_REF non corrisponde al progetto produzione"; exit 1; }

      - name: Install Supabase CLI
        id: cli
        if: ${{ steps.validate.outcome == 'success' }}
        continue-on-error: true
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Link production project
        id: link
        if: ${{ steps.cli.outcome == 'success' }}
        continue-on-error: true
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Dry-run pending production migrations
        id: dry_run
        if: ${{ steps.link.outcome == 'success' }}
        continue-on-error: true
        run: supabase db push --dry-run

      - name: Publish preflight status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          CLI: ${{ steps.cli.outcome }}
          LINK: ${{ steps.link.outcome }}
          DRY_RUN: ${{ steps.dry_run.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          STAGE="success"
          STATE="success"
          if [[ "$CHECKOUT" != "success" ]]; then STAGE="checkout"; STATE="failure";
          elif [[ "$VALIDATE" != "success" ]]; then STAGE="validate"; STATE="failure";
          elif [[ "$CLI" != "success" ]]; then STAGE="cli"; STATE="failure";
          elif [[ "$LINK" != "success" ]]; then STAGE="link"; STATE="failure";
          elif [[ "$DRY_RUN" != "success" ]]; then STAGE="dry-run"; STATE="failure";
          fi
          CONTEXT="filitalia/production-preflight/$STAGE"
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"$CONTEXT\",\"description\":\"Production preflight stage: $STAGE\"}"
          if [[ "$STATE" != "success" ]]; then exit 1; fi
