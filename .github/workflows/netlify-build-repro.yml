name: Netlify Build Repro

on:
  push:
    branches:
      - feature/player-photo-video-submissions
    paths:
      - .github/workflows/netlify-build-repro.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Reproduce Netlify build
        run: npm run build
