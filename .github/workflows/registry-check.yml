name: Player Registry Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate player registry
        run: npm run check-registry
