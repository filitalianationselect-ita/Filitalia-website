name: Preview Project Ref Diagnostic

on:
  push:
    branches:
      - agent/admin-panel-demo
    paths:
      - .github/preview-project-ref-diagnostic-trigger

permissions:
  statuses: write
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    environment: filitalia-preview
    env:
      PROJECT_REF: ${{ secrets.SUPABASE_PREVIEW_PROJECT_REF }}
    steps:
      - name: Publish project ref diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$PROJECT_REF"
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"success\",\"context\":\"filitalia/preview-project/$PROJECT_REF\",\"description\":\"Preview project ref diagnostic\"}"
