name: FIL-ITALIA Public Content Quality

on:
  pull_request:
    paths:
      - "events-data.js"
      - "news-data.js"
      - "public-content-bridge-v1.js"
      - "index.html"
      - "events.html"
      - "news.html"
      - "login.html"
      - "account.html"
      - "login-control-room-v1.css"
      - "login-admin-workspace-v1.css"
      - "login-form-polish-v1.css"
      - "login-form-polish-v1.js"
      - "login-identifier-v1.js"
      - "auth-super-admin-compat-v1.js"
      - "unified-access-v1.js"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "scripts/generate-runtime-config.js"
      - "scripts/audit-public-content.js"
      - "scripts/audit-preview-isolation.js"
      - "scripts/audit-role-consistency.js"
      - "package.json"
      - ".github/workflows/public-content-quality.yml"
  push:
    branches: ["agent/admin-panel-demo"]
    paths:
      - "events-data.js"
      - "news-data.js"
      - "public-content-bridge-v1.js"
      - "index.html"
      - "events.html"
      - "news.html"
      - "login.html"
      - "account.html"
      - "login-control-room-v1.css"
      - "login-admin-workspace-v1.css"
      - "login-form-polish-v1.css"
      - "login-form-polish-v1.js"
      - "login-identifier-v1.js"
      - "auth-super-admin-compat-v1.js"
      - "unified-access-v1.js"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "scripts/generate-runtime-config.js"
      - "scripts/audit-public-content.js"
      - "scripts/audit-preview-isolation.js"
      - "scripts/audit-role-consistency.js"
      - "package.json"
      - ".github/workflows/public-content-quality.yml"

permissions:
  contents: read

jobs:
  public-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check public scripts syntax
        run: |
          node --check public-content-bridge-v1.js
          node --check login-form-polish-v1.js
          node --check login-identifier-v1.js
          node --check auth-super-admin-compat-v1.js
          node --check scripts/generate-runtime-config.js
          node --check scripts/audit-public-content.js
          node --check scripts/audit-preview-isolation.js
          node --check scripts/audit-role-consistency.js
      - name: Protect News and Talent ID archives
        run: node scripts/audit-public-content.js
      - name: Protect deploy preview isolation
        run: node scripts/audit-preview-isolation.js
      - name: Protect Admin and Super Admin roles
        run: node scripts/audit-role-consistency.js
      - name: Verify private normal login layout
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('login.html', 'utf8');
          const required = [
            'Area riservata',
            'Email o nome utente',
            'login-form-polish-v1.css?v=1',
            'login-identifier-v1.js?v=1',
            'loginPasswordToggle'
          ];
          const missing = required.filter(value => !html.includes(value));
          if (missing.length) throw new Error(`Login references missing: ${missing.join(', ')}`);
          if (/CONTROL ROOM|ADMIN PROTETTO|Solo ruoli autorizzati/i.test(html)) throw new Error('Public login reveals administrative hints');
          console.log('Private generic login verified.');
          NODE
