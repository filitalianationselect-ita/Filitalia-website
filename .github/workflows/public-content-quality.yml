name: FIL-ITALIA Public Content Quality

on:
  pull_request:
    paths:
      - "events-data.js"
      - "news-data.js"
      - "public-content-bridge-v1.js"
      - "index.html"
      - "events.html"
      - "news.html"
      - "login.html"
      - "account.html"
      - "login-control-room-v1.css"
      - "auth-super-admin-compat-v1.js"
      - "unified-access-v1.js"
      - "supabase/functions/admin-update-account-status/index.ts"
      - "supabase/migrations/20260728090000_filitalia_admin_complete.sql"
      - "scripts/generate-runtime-config.js"
      - "scripts/audit-public-content.js"
      - "scripts/audit-preview-isolation.js"
      - "scripts/audit-role-consistency.js"
      - "package.json"
      - ".github/workflows/public-content-quality.yml"
  push:
    branches: ["agent/admin-panel-demo"]
    paths:
      - "events-data.js"
      - "news-data.js"
      - "public-content-bridge-v1.js"
      - "index.html"
      - "events.html"
      - "news.html"
      - "login.html"
      - "account.html"
      - "login-control-room-v1.css"
      - "auth-super-admin-compat-v1.js"
      - "unified-access-v1.js"
      - "supabase/functions/admin-update-account-status/index.ts"
      - "supabase/migrations/20260728090000_filitalia_admin_complete.sql"
      - "scripts/generate-runtime-config.js"
      - "scripts/audit-public-content.js"
      - "scripts/audit-preview-isolation.js"
      - "scripts/audit-role-consistency.js"
      - "package.json"
      - ".github/workflows/public-content-quality.yml"

permissions:
  contents: read

jobs:
  public-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check public scripts syntax
        run: |
          node --check public-content-bridge-v1.js
          node --check auth-super-admin-compat-v1.js
          node --check scripts/generate-runtime-config.js
          node --check scripts/audit-public-content.js
          node --check scripts/audit-preview-isolation.js
          node --check scripts/audit-role-consistency.js
      - name: Protect News and Talent ID archives
        run: node scripts/audit-public-content.js
      - name: Protect deploy preview isolation
        run: node scripts/audit-preview-isolation.js
      - name: Protect Admin and Super Admin roles
        run: node scripts/audit-role-consistency.js
      - name: Verify Admin workspace login layout
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('login.html', 'utf8');
          const css = fs.readFileSync('login-control-room-v1.css', 'utf8');
          const requiredHtml = [
            'login-control-room-v1.css?v=3',
            'login-workspace-hero',
            'login-summary-grid',
            'login-access-panel',
            'login-panel-grid'
          ];
          const missing = requiredHtml.filter(value => !html.includes(value));
          if (missing.length) throw new Error(`Login workspace references missing: ${missing.join(', ')}`);
          if (!css.includes('width: min(1180px, 100%)')) throw new Error('Login workspace width missing');
          if (!css.includes('grid-template-columns: repeat(4, minmax(0, 1fr))')) throw new Error('Login summary cards missing');
          if (!css.includes('grid-template-columns: minmax(0, 1fr) 310px')) throw new Error('Login workspace content grid missing');
          if (!css.includes('min-height: 44px')) throw new Error('Accessible login controls were removed');
          console.log('Admin Event Workspace-style login verified.');
          NODE
