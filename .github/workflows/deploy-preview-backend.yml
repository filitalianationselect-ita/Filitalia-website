name: Deploy Preview Backend

on:
  push:
    branches:
      - agent/admin-panel-demo
    paths:
      - .github/preview-backend-trigger
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Scrivi DEPLOY PREVIEW per confermare"
        required: true
        type: string
      preview_origin:
        description: "URL completo della Deploy Preview Netlify"
        required: true
        default: "https://deploy-preview-1--filitalia.netlify.app"
        type: string

permissions:
  contents: read
  statuses: write

jobs:
  deploy_preview:
    name: Supabase preview only
    if: ${{ github.event_name == 'push' || inputs.confirmation == 'DEPLOY PREVIEW' }}
    runs-on: ubuntu-latest
    environment: filitalia-preview
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PREVIEW_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PREVIEW_DB_PASSWORD }}
      PROJECT_REF: cfqqovqkjrsarwmopyvl
      PREVIEW_ORIGIN: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_origin || 'https://deploy-preview-1--filitalia.netlify.app' }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_PREVIEW_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_PREVIEW_CLIENT_SECRET }}
      GMAIL_TOKEN_ENCRYPTION_KEY: ${{ secrets.GMAIL_PREVIEW_TOKEN_ENCRYPTION_KEY }}

    steps:
      - name: Checkout preview branch
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4

      - name: Validate preview-only configuration
        id: validate
        if: ${{ steps.checkout.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_PREVIEW_ACCESS_TOKEN mancante"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "SUPABASE_PREVIEW_DB_PASSWORD mancante"; exit 1; }
          [[ "$PROJECT_REF" == "cfqqovqkjrsarwmopyvl" ]] || { echo "BLOCCATO: Preview deve usare cfqqovqkjrsarwmopyvl."; exit 1; }
          [[ "$PROJECT_REF" != "exwykgaotochaguizxxt" ]] || { echo "BLOCCATO: il progetto produzione non può essere usato dalla Preview."; exit 1; }
          [[ "$PREVIEW_ORIGIN" == https://*--filitalia.netlify.app ]] || { echo "L'origine non è una Deploy Preview FIL-ITALIA"; exit 1; }
          if [[ -n "$GMAIL_CLIENT_ID" || -n "$GMAIL_CLIENT_SECRET" || -n "$GMAIL_TOKEN_ENCRYPTION_KEY" ]]; then
            test -n "$GMAIL_CLIENT_ID" || { echo "GMAIL_PREVIEW_CLIENT_ID mancante"; exit 1; }
            test -n "$GMAIL_CLIENT_SECRET" || { echo "GMAIL_PREVIEW_CLIENT_SECRET mancante"; exit 1; }
            test -n "$GMAIL_TOKEN_ENCRYPTION_KEY" || { echo "GMAIL_PREVIEW_TOKEN_ENCRYPTION_KEY mancante"; exit 1; }
            [[ ${#GMAIL_TOKEN_ENCRYPTION_KEY} -ge 40 ]] || { echo "La chiave di cifratura Gmail non sembra valida"; exit 1; }
          fi

      - name: Install Supabase CLI
        id: cli
        if: ${{ steps.validate.outcome == 'success' }}
        continue-on-error: true
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Link preview Supabase project
        id: link
        if: ${{ steps.cli.outcome == 'success' }}
        continue-on-error: true
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Preview database changes
        id: dry_run
        if: ${{ steps.link.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          OUTPUT="$(supabase db push --include-all --dry-run 2>&1)"
          CODE=$?
          printf '%s\n' "$OUTPUT"
          REASON="$(printf '%s\n' "$OUTPUT" | grep -Eiv '^[[:space:]]*$' | grep -Ei 'error|failed|not found|mismatch|migration|duplicate|invalid|remote|local' | tail -n 1)"
          if [[ -z "$REASON" ]]; then
            REASON="$(printf '%s\n' "$OUTPUT" | grep -Eiv '^[[:space:]]*$' | tail -n 1)"
          fi
          SLUG="$(printf '%s' "$REASON" | tr '[:upper:]' '[:lower:]' | sed -E 's#https?://[^ ]+#url#g; s/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-58)"
          [[ -n "$SLUG" ]] || SLUG="unknown"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          exit "$CODE"

      - name: Apply pending database migrations
        id: db_push
        if: ${{ steps.dry_run.outcome == 'success' }}
        continue-on-error: true
        run: supabase db push --include-all --yes

      - name: Configure preview core secrets
        id: core_secrets
        if: ${{ steps.db_push.outcome == 'success' }}
        continue-on-error: true
        run: supabase secrets set --project-ref "$PROJECT_REF" ADMIN_SITE_ORIGIN="$PREVIEW_ORIGIN"

      - name: Configure optional Gmail secrets
        id: gmail_secrets
        if: ${{ steps.core_secrets.outcome == 'success' && env.GMAIL_CLIENT_ID != '' && env.GMAIL_CLIENT_SECRET != '' && env.GMAIL_TOKEN_ENCRYPTION_KEY != '' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          CALLBACK="https://${PROJECT_REF}.supabase.co/functions/v1/gmail-oauth-callback"
          supabase secrets set --project-ref "$PROJECT_REF" \
            GMAIL_CLIENT_ID="$GMAIL_CLIENT_ID" \
            GMAIL_CLIENT_SECRET="$GMAIL_CLIENT_SECRET" \
            GMAIL_REDIRECT_URI="$CALLBACK" \
            GMAIL_TOKEN_ENCRYPTION_KEY="$GMAIL_TOKEN_ENCRYPTION_KEY"

      - name: Deploy all preview Edge Functions
        id: functions
        if: ${{ steps.core_secrets.outcome == 'success' && (steps.gmail_secrets.outcome == 'success' || steps.gmail_secrets.outcome == 'skipped') }}
        continue-on-error: true
        run: supabase functions deploy --project-ref "$PROJECT_REF"

      - name: Publish diagnostic status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          CLI: ${{ steps.cli.outcome }}
          LINK: ${{ steps.link.outcome }}
          DRY_RUN: ${{ steps.dry_run.outcome }}
          DRY_SLUG: ${{ steps.dry_run.outputs.slug }}
          DB_PUSH: ${{ steps.db_push.outcome }}
          CORE_SECRETS: ${{ steps.core_secrets.outcome }}
          GMAIL_SECRETS: ${{ steps.gmail_secrets.outcome }}
          FUNCTIONS: ${{ steps.functions.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          STAGE="success"
          STATE="success"
          if [[ "$CHECKOUT" != "success" ]]; then STAGE="checkout"; STATE="failure";
          elif [[ "$VALIDATE" != "success" ]]; then STAGE="validate"; STATE="failure";
          elif [[ "$CLI" != "success" ]]; then STAGE="cli"; STATE="failure";
          elif [[ "$LINK" != "success" ]]; then STAGE="link"; STATE="failure";
          elif [[ "$DRY_RUN" != "success" ]]; then STAGE="dry-run-${DRY_SLUG:-unknown}"; STATE="failure";
          elif [[ "$DB_PUSH" != "success" ]]; then STAGE="db-push"; STATE="failure";
          elif [[ "$CORE_SECRETS" != "success" ]]; then STAGE="core-secrets"; STATE="failure";
          elif [[ "$GMAIL_SECRETS" != "success" && "$GMAIL_SECRETS" != "skipped" ]]; then STAGE="gmail-secrets"; STATE="failure";
          elif [[ "$FUNCTIONS" != "success" ]]; then STAGE="functions"; STATE="failure";
          fi
          CONTEXT="filitalia/preview-backend/$STAGE"
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"$CONTEXT\",\"description\":\"Preview backend stage: $STAGE\"}"
          if [[ "$STATE" != "success" ]]; then exit 1; fi
