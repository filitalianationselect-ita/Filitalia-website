name: Preview Test Login QA

on:
  push:
    branches: [feature/player-photo-video-submissions]
    paths: [.github/workflows/preview-test-login-qa.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser
        run: |
          npm install --no-save --silent playwright-core
          CHROME_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Test Preview Player login
        env:
          PREVIEW: https://deploy-preview-16--filitalia.netlify.app
        run: |
          node <<'NODE'
          const { chromium } = require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.goto(process.env.PREVIEW+'/login.html?qa='+Date.now(),{waitUntil:'networkidle',timeout:120000});
            const creds=await page.evaluate(()=>window.FilitaliaAuth&&window.FilitaliaAuth.previewTestCredentials);
            if(!creds) throw new Error('Preview credentials missing');
            await page.fill('#loginIdentifierVisible',creds.email);
            await page.fill('#loginPasswordVisible',creds.password);
            await Promise.all([
              page.waitForURL(/account\.html/,{timeout:30000}),
              page.click('#loginForm button[type="submit"]')
            ]);
            await page.waitForSelector('#playerMediaSection:not([hidden])',{timeout:20000});
            const state=await page.evaluate(()=>({
              name:document.querySelector('#accountName')?.textContent?.trim(),
              role:document.body.dataset.accountRole,
              status:document.body.dataset.accountStatus,
              media:!!document.querySelector('#playerMediaSection:not([hidden])'),
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
            }));
            if(state.name!=='Player Test'||state.role!=='player'||state.status!=='active'||!state.media||state.overflow>3){
              throw new Error('Preview Player login state invalid: '+JSON.stringify(state));
            }
            console.log('PASS '+JSON.stringify(state));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
