name: FIL-ITALIA About Events Modern QA

on:
  pull_request:
    paths:
      - "index.html"
      - "events.html"
      - "home-about-slider-v1.css"
      - "home-about-slider-v1.js"
      - "home-homehub-v1.js"
      - "event-modal-modern-v1.css"
      - "event-modal-modern-v1.js"
      - ".github/workflows/about-events-modern-qa.yml"
  push:
    branches: ["agent/admin-panel-demo"]
    paths:
      - "index.html"
      - "events.html"
      - "home-about-slider-v1.css"
      - "home-about-slider-v1.js"
      - "home-homehub-v1.js"
      - "event-modal-modern-v1.css"
      - "event-modal-modern-v1.js"
      - ".github/workflows/about-events-modern-qa.yml"

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare system Chrome
        run: |
          npm install --no-save --silent playwright-core
          CHROME_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Verify current About deploy and modern event modal
        run: |
          node <<'NODE'
          const fs=require('fs');
          const { chromium }=require('playwright-core');
          const root='https://deploy-preview-1--filitalia.netlify.app';
          const expectedVersion='about-clean-v3';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          fs.mkdirSync('artifacts',{recursive:true});

          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1360,height:960},deviceScaleFactor:1});
            await page.emulateMedia({reducedMotion:'no-preference'});

            let currentDeploy=false;
            for(let i=0;i<90;i++){
              await page.goto(`${root}/index.html?aboutClean=${Date.now()}-${i}#about`,{waitUntil:'domcontentloaded',timeout:120000});
              try{
                await page.waitForSelector(`#about[data-fil-about-showcase-version="${expectedVersion}"] .fil-about-slider-tab`,{timeout:1800});
                currentDeploy=true;
                break;
              }catch(_){
                await sleep(1000);
              }
            }
            if(!currentDeploy)throw new Error(`Current About deploy ${expectedVersion} did not become available`);
            await page.waitForTimeout(1400);

            const before=await page.evaluate(()=>{
              const about=document.querySelector('#about');
              const slider=about?.querySelector('.fil-about-slider');
              const cards=[...(about?.querySelectorAll('.fil-about-slider-track>.about-card')||[])];
              const tabs=[...(about?.querySelectorAll('.fil-about-slider-tab')||[])];
              const media=about?.querySelector('.fil-about-story-media');
              const social=about?.querySelector('.fil-about-social-cta');
              const layout=about?.querySelector('.fil-about-layout');
              const sliderRect=slider?.getBoundingClientRect();
              const mediaRect=media?.getBoundingClientRect();
              const socialRect=social?.getBoundingClientRect();
              const layoutRect=layout?.getBoundingClientRect();
              const activeTab=tabs.findIndex(tab=>tab.getAttribute('aria-selected')==='true');
              const activeCard=cards.findIndex(card=>card.getAttribute('aria-hidden')==='false');
              const visibleCards=cards.filter(card=>!card.hidden&&getComputedStyle(card).display!=='none').length;
              const activeHeading=cards[activeCard]?.querySelector('h3');
              const activeParagraph=cards[activeCard]?.querySelector('p');
              const progress=tabs[activeTab]?.querySelector('.fil-about-slider-tab-progress');
              return {
                version:about?.dataset.filAboutShowcaseVersion||'',
                cards:cards.length,
                tabs:tabs.length,
                arrows:about?.querySelectorAll('.fil-about-slider-arrow').length||0,
                labels:tabs.map(tab=>(tab.querySelector('.fil-about-slider-tab-label')?.textContent||'').trim()),
                activeTab,
                activeCard,
                visibleCards,
                titleColor:activeHeading?getComputedStyle(activeHeading).color:'',
                paragraphColor:activeParagraph?getComputedStyle(activeParagraph).color:'',
                tabBackground:tabs[activeTab]?getComputedStyle(tabs[activeTab]).backgroundImage:'',
                timerAnimation:progress?getComputedStyle(progress).animationName:'',
                sliderWidth:sliderRect?.width||0,
                sliderLeft:sliderRect?.left||0,
                mediaWidth:mediaRect?.width||0,
                mediaHeight:mediaRect?.height||0,
                mediaLeft:mediaRect?.left||0,
                socialWidth:socialRect?.width||0,
                socialLeft:socialRect?.left||0,
                layoutWidth:layoutRect?.width||0,
                layoutLeft:layoutRect?.left||0,
                socialDisplay:social?getComputedStyle(social).display:'none',
                overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
              };
            });

            const expectedLabels=['Identità nazionale','Sviluppo giocatori','Visione internazionale'];
            if(before.version!==expectedVersion)throw new Error(`Wrong About version: ${JSON.stringify(before)}`);
            if(before.cards!==3||before.tabs!==3||before.arrows!==2)throw new Error(`About controls missing: ${JSON.stringify(before)}`);
            if(JSON.stringify(before.labels)!==JSON.stringify(expectedLabels))throw new Error(`About tab labels invalid: ${JSON.stringify(before)}`);
            if(before.activeTab!==0||before.activeCard!==0||before.visibleCards!==1)throw new Error(`About initial slide invalid: ${JSON.stringify(before)}`);
            if(before.mediaLeft<=before.sliderLeft||before.mediaWidth<280||before.mediaWidth>420||before.mediaHeight>510)throw new Error(`About image is not proportionate on the right: ${JSON.stringify(before)}`);
            if(before.socialDisplay==='none'||Math.abs(before.socialWidth-before.layoutWidth)>5||Math.abs(before.socialLeft-before.layoutLeft)>5)throw new Error(`About social strip width invalid: ${JSON.stringify(before)}`);
            if(!before.titleColor.includes('255')||!before.paragraphColor.includes('241'))throw new Error(`About text contrast invalid: ${JSON.stringify(before)}`);
            if(!before.tabBackground.includes('gradient')||before.timerAnimation==='none')throw new Error(`About active selector or timer invalid: ${JSON.stringify(before)}`);
            if(before.overflow>3)throw new Error(`About desktop overflow: ${JSON.stringify(before)}`);
            await page.locator('#about').screenshot({path:'artifacts/about-desktop.png'});

            await page.locator('#about .fil-about-slider-tab').nth(1).click();
            await page.waitForTimeout(500);
            const clicked=await page.evaluate(()=>({
              activeTab:[...document.querySelectorAll('#about .fil-about-slider-tab')].findIndex(tab=>tab.getAttribute('aria-selected')==='true'),
              activeCard:[...document.querySelectorAll('#about .fil-about-slider-track>.about-card')].findIndex(card=>card.getAttribute('aria-hidden')==='false'),
              visibleCards:[...document.querySelectorAll('#about .fil-about-slider-track>.about-card')].filter(card=>!card.hidden&&getComputedStyle(card).display!=='none').length,
              heading:(document.querySelector('#about .about-card[aria-hidden="false"] h3')?.textContent||'').trim()
            }));
            if(clicked.activeTab!==1||clicked.activeCard!==1||clicked.visibleCards!==1||clicked.heading!=='Sviluppo giocatori')throw new Error(`About slide 02 did not open: ${JSON.stringify(clicked)}`);

            await page.waitForTimeout(9300);
            const timed=await page.evaluate(()=>({
              activeTab:[...document.querySelectorAll('#about .fil-about-slider-tab')].findIndex(tab=>tab.getAttribute('aria-selected')==='true'),
              heading:(document.querySelector('#about .about-card[aria-hidden="false"] h3')?.textContent||'').trim()
            }));
            if(timed.activeTab!==2||timed.heading!=='Visione internazionale')throw new Error(`About timer did not advance: ${JSON.stringify(timed)}`);

            await page.setViewportSize({width:390,height:844});
            await page.goto(`${root}/index.html?aboutCleanMobile=${Date.now()}#about`,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForSelector(`#about[data-fil-about-showcase-version="${expectedVersion}"] .fil-about-slider-tab`,{timeout:20000});
            await page.waitForTimeout(1200);
            const mobile=await page.evaluate(()=>{
              const slider=document.querySelector('#about .fil-about-slider');
              const media=document.querySelector('#about .fil-about-story-media');
              const social=document.querySelector('#about .fil-about-social-cta');
              const sliderRect=slider?.getBoundingClientRect();
              const mediaRect=media?.getBoundingClientRect();
              const socialRect=social?.getBoundingClientRect();
              return {
                tabs:document.querySelectorAll('#about .fil-about-slider-tab').length,
                visibleCards:[...document.querySelectorAll('#about .fil-about-slider-track>.about-card')].filter(card=>!card.hidden&&getComputedStyle(card).display!=='none').length,
                sliderWidth:sliderRect?.width||0,
                mediaWidth:mediaRect?.width||0,
                mediaTop:mediaRect?.top||0,
                sliderBottom:sliderRect?.bottom||0,
                socialWidth:socialRect?.width||0,
                socialTop:socialRect?.top||0,
                mediaBottom:mediaRect?.bottom||0,
                viewport:innerWidth,
                overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
              };
            });
            if(mobile.tabs!==3||mobile.visibleCards!==1||mobile.sliderWidth>mobile.viewport+2||mobile.mediaWidth<220||mobile.mediaWidth>335||mobile.mediaTop<=mobile.sliderBottom||mobile.socialTop<=mobile.mediaBottom||mobile.socialWidth>mobile.viewport+2||mobile.overflow>3)throw new Error(`About mobile layout invalid: ${JSON.stringify(mobile)}`);
            await page.locator('#about').screenshot({path:'artifacts/about-mobile.png'});

            await page.setViewportSize({width:1360,height:900});
            await page.goto(`${root}/events.html?eventqa=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForSelector('#allEventsGrid a',{timeout:20000});
            await page.waitForTimeout(1500);
            await page.locator('#allEventsGrid a').first().click();
            await page.waitForSelector('#infoModal.fil-event-modal-modern.is-open .fil-event-modal-copy h2',{timeout:10000});
            const event=await page.evaluate(()=>{
              const modal=document.querySelector('#infoModal.fil-event-modal-modern.is-open');
              const image=modal?.querySelector('.fil-event-modal-media img');
              return {
                title:modal?.querySelector('.fil-event-modal-copy h2')?.textContent.trim()||'',
                description:modal?.querySelector('.fil-event-modal-description')?.textContent.trim()||'',
                meta:modal?.querySelectorAll('.fil-event-modal-meta article').length||0,
                register:modal?.querySelector('.fil-event-modal-register')?.getAttribute('href')||'',
                imageWidth:image?.naturalWidth||0,
                display:modal?getComputedStyle(modal).display:'none'
              };
            });
            if(!event.title||event.description.length<30||event.meta!==4||!event.register.includes('camp-register.html?event=')||event.imageWidth<1||event.display==='none')throw new Error(`Modern event invalid: ${JSON.stringify(event)}`);

            await browser.close();
            console.log(JSON.stringify({before,clicked,timed,mobile,event},null,2));
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
      - name: Upload About preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: about-preview-screenshots
          path: artifacts/about-*.png
          if-no-files-found: warn
          retention-days: 7
