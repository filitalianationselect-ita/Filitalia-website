name: FIL-ITALIA About Events Modern QA

on:
  pull_request:
    paths:
      - "index.html"
      - "events.html"
      - "home-about-slider-v1.css"
      - "home-about-slider-v1.js"
      - "home-about-slider-v2.css"
      - "home-about-slider-v2.js"
      - "home-homehub-v1.js"
      - "event-modal-modern-v1.css"
      - "event-modal-modern-v1.js"
      - ".github/workflows/about-events-modern-qa.yml"
  push:
    branches: ["agent/admin-panel-demo"]
    paths:
      - "index.html"
      - "events.html"
      - "home-about-slider-v1.css"
      - "home-about-slider-v1.js"
      - "home-about-slider-v2.css"
      - "home-about-slider-v2.js"
      - "home-homehub-v1.js"
      - "event-modal-modern-v1.css"
      - "event-modal-modern-v1.js"
      - ".github/workflows/about-events-modern-qa.yml"

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare system Chrome
        run: |
          npm install --no-save --silent playwright-core
          CHROME_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Verify titled About slider, social strip and modern event modal
        run: |
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const root='https://deploy-preview-1--filitalia.netlify.app';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1360,height:960}});

            for(let i=0;i<45;i++){
              await page.goto(`${root}/index.html?aboutv2=${Date.now()}-${i}#about`,{waitUntil:'domcontentloaded',timeout:120000});
              try{
                await page.waitForSelector('#about .fil-about-slider-v2 .fil-about-slider-tab',{timeout:2500});
                const ready=await page.locator('body[data-horizontal-ready="true"]').count();
                if(ready)break;
              }catch(_){ }
              await sleep(1000);
            }
            await page.waitForTimeout(1900);

            const aboutBefore=await page.evaluate(()=>{
              const slider=document.querySelector('#about .fil-about-slider-v2');
              const track=document.querySelector('#about .fil-about-slider-track');
              const cards=[...document.querySelectorAll('#about .fil-about-slider-track>.about-card')];
              const tabs=[...document.querySelectorAll('#about .fil-about-slider-tab')];
              const media=document.querySelector('#about .fil-about-story-media');
              const social=document.querySelector('#about .fil-about-social-cta');
              const layout=document.querySelector('#about .fil-about-layout');
              const sliderRect=slider?.getBoundingClientRect();
              const mediaRect=media?.getBoundingClientRect();
              const socialRect=social?.getBoundingClientRect();
              const layoutRect=layout?.getBoundingClientRect();
              return{
                cards:cards.length,
                tabs:tabs.length,
                arrows:document.querySelectorAll('#about .fil-about-slider-arrow').length,
                labels:tabs.map(tab=>(tab.querySelector('.fil-about-slider-tab-label')?.textContent||'').trim()),
                activeTab:tabs.findIndex(tab=>tab.getAttribute('aria-selected')==='true'),
                activeCard:cards.findIndex(card=>card.getAttribute('aria-hidden')==='false'),
                transform:track?getComputedStyle(track).transform:'',
                sliderWidth:sliderRect?.width||0,
                sliderLeft:sliderRect?.left||0,
                mediaWidth:mediaRect?.width||0,
                mediaHeight:mediaRect?.height||0,
                mediaLeft:mediaRect?.left||0,
                socialWidth:socialRect?.width||0,
                socialLeft:socialRect?.left||0,
                layoutWidth:layoutRect?.width||0,
                layoutLeft:layoutRect?.left||0,
                socialDisplay:social?getComputedStyle(social).display:'none',
                overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
              };
            });

            const expected=['Identità nazionale','Sviluppo giocatori','Visione internazionale'];
            if(aboutBefore.cards!==3||aboutBefore.tabs!==3||aboutBefore.arrows!==2)throw new Error(`About controls missing: ${JSON.stringify(aboutBefore)}`);
            if(JSON.stringify(aboutBefore.labels)!==JSON.stringify(expected))throw new Error(`About tab labels invalid: ${JSON.stringify(aboutBefore)}`);
            if(aboutBefore.activeTab!==0||aboutBefore.activeCard!==0)throw new Error(`About initial slide invalid: ${JSON.stringify(aboutBefore)}`);
            if(aboutBefore.mediaLeft<=aboutBefore.sliderLeft||aboutBefore.mediaWidth<250||aboutBefore.mediaWidth>410||aboutBefore.mediaHeight>520)throw new Error(`About image is not compact on the right: ${JSON.stringify(aboutBefore)}`);
            if(aboutBefore.socialDisplay==='none'||Math.abs(aboutBefore.socialWidth-aboutBefore.layoutWidth)>5||Math.abs(aboutBefore.socialLeft-aboutBefore.layoutLeft)>5)throw new Error(`About social strip does not span both columns: ${JSON.stringify(aboutBefore)}`);
            if(aboutBefore.overflow>3)throw new Error(`About desktop overflow: ${JSON.stringify(aboutBefore)}`);

            await page.locator('#about .fil-about-slider-tab').nth(1).click();
            await page.waitForTimeout(650);
            const aboutAfter=await page.evaluate(()=>({
              activeTab:[...document.querySelectorAll('#about .fil-about-slider-tab')].findIndex(tab=>tab.getAttribute('aria-selected')==='true'),
              activeCard:[...document.querySelectorAll('#about .fil-about-slider-track>.about-card')].findIndex(card=>card.getAttribute('aria-hidden')==='false'),
              heading:(document.querySelector('#about .about-card[aria-hidden="false"] h3')?.textContent||'').trim(),
              transform:getComputedStyle(document.querySelector('#about .fil-about-slider-track')).transform
            }));
            if(aboutAfter.activeTab!==1||aboutAfter.activeCard!==1||aboutAfter.heading!=='Sviluppo giocatori'||aboutAfter.transform===aboutBefore.transform)throw new Error(`About second title did not open slide 2: ${JSON.stringify({aboutBefore,aboutAfter})}`);

            await page.setViewportSize({width:390,height:844});
            await page.goto(`${root}/index.html?aboutv2mobile=${Date.now()}#about`,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForSelector('#about .fil-about-slider-v2 .fil-about-slider-tab',{timeout:20000});
            await page.waitForTimeout(1500);
            const aboutMobile=await page.evaluate(()=>{
              const slider=document.querySelector('#about .fil-about-slider-v2');
              const media=document.querySelector('#about .fil-about-story-media');
              const social=document.querySelector('#about .fil-about-social-cta');
              const sliderRect=slider?.getBoundingClientRect();
              const mediaRect=media?.getBoundingClientRect();
              const socialRect=social?.getBoundingClientRect();
              return{
                tabs:document.querySelectorAll('#about .fil-about-slider-tab').length,
                sliderWidth:sliderRect?.width||0,
                mediaWidth:mediaRect?.width||0,
                mediaTop:mediaRect?.top||0,
                sliderBottom:sliderRect?.bottom||0,
                socialWidth:socialRect?.width||0,
                socialTop:socialRect?.top||0,
                mediaBottom:mediaRect?.bottom||0,
                viewport:innerWidth,
                overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
              };
            });
            if(aboutMobile.tabs!==3||aboutMobile.sliderWidth>aboutMobile.viewport+2||aboutMobile.mediaWidth<220||aboutMobile.mediaWidth>350||aboutMobile.mediaTop<=aboutMobile.sliderBottom||aboutMobile.socialTop<=aboutMobile.mediaBottom||aboutMobile.socialWidth>aboutMobile.viewport+2||aboutMobile.overflow>3)throw new Error(`About mobile layout invalid: ${JSON.stringify(aboutMobile)}`);

            await page.setViewportSize({width:1360,height:900});
            await page.goto(`${root}/events.html?eventqa=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForSelector('#allEventsGrid a',{timeout:20000});
            await page.waitForTimeout(1800);
            await page.locator('#allEventsGrid a').first().click();
            await page.waitForSelector('#infoModal.fil-event-modal-modern.is-open .fil-event-modal-copy h2',{timeout:10000});
            const firstEvent=await page.evaluate(()=>{
              const modal=document.querySelector('#infoModal.fil-event-modal-modern.is-open');
              const image=modal?.querySelector('.fil-event-modal-media img');
              return{
                title:modal?.querySelector('.fil-event-modal-copy h2')?.textContent.trim()||'',
                description:modal?.querySelector('.fil-event-modal-description')?.textContent.trim()||'',
                meta:modal?.querySelectorAll('.fil-event-modal-meta article').length||0,
                register:modal?.querySelector('.fil-event-modal-register')?.getAttribute('href')||'',
                imageWidth:image?.naturalWidth||0,
                display:modal?getComputedStyle(modal).display:'none'
              };
            });
            if(!firstEvent.title||firstEvent.description.length<30||firstEvent.meta!==4)throw new Error(`Modern event content missing: ${JSON.stringify(firstEvent)}`);
            if(!firstEvent.register.includes('camp-register.html?event='))throw new Error(`Registration link missing: ${JSON.stringify(firstEvent)}`);
            if(firstEvent.imageWidth<1||firstEvent.display==='none')throw new Error(`Modern event not visible: ${JSON.stringify(firstEvent)}`);

            await browser.close();
            console.log(JSON.stringify({aboutBefore,aboutAfter,aboutMobile,firstEvent},null,2));
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
