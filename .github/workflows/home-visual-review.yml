name: FIL-ITALIA Home Visual Review

on:
  push:
    branches: ["agent/admin-panel-demo"]
    paths:
      - ".github/workflows/home-visual-review.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-panel-demo
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium
        run: |
          npm install --no-save --silent playwright
          npx playwright install --with-deps chromium
      - name: Capture live homepage
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1280,height:800},deviceScaleFactor:1});
            await page.goto('https://deploy-preview-1--filitalia.netlify.app/?visual-review=4',{waitUntil:'networkidle',timeout:120000});
            await page.waitForTimeout(2500);
            await page.screenshot({path:'/tmp/home-review.jpg',type:'jpeg',quality:58,fullPage:false});
            const selectors=['.navbar','.home-hero-shell','.home-hero-title','.home-player-frame','.home-event-rail','.home-value-strip'];
            const metrics={url:page.url(),title:await page.title(),viewport:{width:1280,height:800},elements:{}};
            for(const selector of selectors){
              const node=page.locator(selector).first();
              metrics.elements[selector]=await node.count()?await node.boundingBox():null;
            }
            metrics.bodyScrollWidth=await page.evaluate(()=>document.documentElement.scrollWidth);
            metrics.bodyClientWidth=await page.evaluate(()=>document.documentElement.clientWidth);
            fs.writeFileSync('/tmp/home-metrics.json',JSON.stringify(metrics,null,2));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
      - name: Save compact visual evidence
        run: |
          mkdir -p visual-review
          base64 -w 0 /tmp/home-review.jpg > /tmp/home-review.b64
          split -b 18000 -d -a 2 /tmp/home-review.b64 visual-review/home-review-part-
          cp /tmp/home-metrics.json visual-review/home-metrics.json
          git config user.name "filitalia-visual-bot"
          git config user.email "actions@users.noreply.github.com"
          git add visual-review
          git commit -m "test: capture live homepage visual review"
          git push origin HEAD:agent/admin-panel-demo
