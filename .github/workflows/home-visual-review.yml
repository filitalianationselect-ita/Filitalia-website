name: FIL-ITALIA Home Visual Review

on:
  push:
    branches: ["agent/admin-panel-demo"]
    paths:
      - ".github/workflows/home-visual-review.yml"
      - "index.html"
      - "home-tricolore-v1.css"
      - "home-tricolore-v1.js"
      - "home-horizontal-v1.css"
      - "home-horizontal-v1.js"
      - "home-horizontal-mobile-v1.css"
      - "home-content-v2.css"
      - "home-content-v2.js"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-panel-demo
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium
        run: |
          npm install --no-save --silent playwright
          npx playwright install --with-deps chromium
      - name: Capture live horizontal panels
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const base='https://deploy-preview-1--filitalia.netlify.app/?visual-review=content-v2';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const desktop=await browser.newPage({viewport:{width:1280,height:800},deviceScaleFactor:1});
            let ready=false;
            for(let attempt=0;attempt<70;attempt++){
              await desktop.goto(base+'&attempt='+attempt,{waitUntil:'domcontentloaded',timeout:120000});
              try{
                await desktop.waitForSelector('body[data-horizontal-ready="true"]',{timeout:2200});
                await desktop.waitForSelector('.fil-player-panel-controls',{timeout:2200});
                await desktop.waitForSelector('#homeEventsGrid .fil-event-card-v2',{timeout:2200});
                ready=true;
                break;
              }catch(error){await desktop.waitForTimeout(1500);}
            }
            if(!ready)throw new Error('Redesigned horizontal homepage was not available on Deploy Preview');
            await desktop.waitForTimeout(2200);

            async function go(page,id){
              await page.evaluate(target=>{
                const link=document.querySelector(`.nav-links a[href="#${target}"]`);
                if(link)link.click();
                else location.hash=target;
              },id);
              await page.waitForTimeout(850);
            }

            const panels=['top','players','gallery','staff','news','events'];
            for(const id of panels){
              await go(desktop,id);
              await desktop.screenshot({path:`/tmp/panel-${id}.jpg`,type:'jpeg',quality:76,fullPage:false});
            }

            const metrics={
              url:desktop.url(),
              title:await desktop.title(),
              viewport:{width:1280,height:800},
              bodyScrollWidth:await desktop.evaluate(()=>document.documentElement.scrollWidth),
              bodyClientWidth:await desktop.evaluate(()=>document.documentElement.clientWidth),
              stageScrollWidth:await desktop.locator('.home-horizontal-stage').evaluate(node=>node.scrollWidth),
              panelCount:await desktop.locator('.home-horizontal-panel').count(),
              playerCards:await desktop.locator('#homePlayersGrid .player-card').count(),
              eventOrder:await desktop.locator('#homeEventsGrid .fil-event-card-v2').evaluateAll(cards=>cards.map(card=>({
                id:card.dataset.eventId||'',
                date:card.querySelector('time')?.textContent?.trim()||'',
                title:card.querySelector('h3')?.textContent?.trim()||'',
                status:card.querySelector('.fil-event-status')?.textContent?.trim()||''
              })))
            };

            const mobile=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            await mobile.goto(base+'&mobile=1',{waitUntil:'networkidle',timeout:120000});
            await mobile.waitForSelector('.fil-player-panel-controls',{timeout:15000});
            await mobile.waitForTimeout(1000);
            await mobile.screenshot({path:'/tmp/panel-mobile-home.jpg',type:'jpeg',quality:76,fullPage:false});
            await go(mobile,'events');
            await mobile.screenshot({path:'/tmp/panel-mobile-events.jpg',type:'jpeg',quality:76,fullPage:false});
            metrics.mobile={
              bodyScrollWidth:await mobile.evaluate(()=>document.documentElement.scrollWidth),
              bodyClientWidth:await mobile.evaluate(()=>document.documentElement.clientWidth),
              heroShell:await mobile.locator('.home-hero-shell').boundingBox(),
              playerCardWidth:await mobile.locator('#homePlayersGrid .player-card').first().evaluate(node=>node.getBoundingClientRect().width)
            };

            fs.writeFileSync('/tmp/home-metrics.json',JSON.stringify(metrics,null,2));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
      - name: Build contact sheet
        run: |
          python3 -m pip install --quiet pillow
          python3 <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          names=['top','players','gallery','staff','news','events']
          labels=['HOME','PLAYERS','MEDIA','STAFF','NEWS','EVENTI']
          canvas=Image.new('RGB',(1280,1320),'white')
          for index,(name,label) in enumerate(zip(names,labels)):
              image=Image.open(f'/tmp/panel-{name}.jpg').convert('RGB')
              image=ImageOps.fit(image,(620,380),method=Image.Resampling.LANCZOS)
              x=20+(index%2)*640
              y=20+(index//2)*430
              canvas.paste(image,(x,y+30))
              draw=ImageDraw.Draw(canvas)
              draw.text((x,y+5),label,fill='black')
          canvas.save('/tmp/panel-contact-sheet.jpg',quality=58,optimize=True)
          PY
      - name: Save visual evidence
        run: |
          rm -rf visual-review
          mkdir -p visual-review
          cp /tmp/panel-*.jpg visual-review/
          cp /tmp/home-metrics.json visual-review/home-metrics.json
          base64 -w 0 /tmp/panel-contact-sheet.jpg > /tmp/panel-contact-sheet.b64
          split -b 18000 -d -a 2 /tmp/panel-contact-sheet.b64 visual-review/contact-sheet-part-
          git config user.name "filitalia-visual-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A visual-review
          git commit -m "test: capture redesigned horizontal panels"
          git push origin HEAD:agent/admin-panel-demo
