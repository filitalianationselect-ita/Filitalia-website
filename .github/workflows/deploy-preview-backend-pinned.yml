name: Deploy Preview Backend Pinned

on:
  push:
    branches:
      - agent/player-registry-dedupe
    paths:
      - '.github/workflows/deploy-preview-backend-pinned.yml'

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: filitalia-preview
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PREVIEW_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PREVIEW_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PREVIEW_PROJECT_REF }}
      PREVIEW_ORIGIN: https://deploy-preview-3--filitalia.netlify.app
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_PREVIEW_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_PREVIEW_CLIENT_SECRET }}
      GMAIL_TOKEN_ENCRYPTION_KEY: ${{ secrets.GMAIL_PREVIEW_TOKEN_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Validate Preview secrets
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$PROJECT_REF"

      - name: Link Preview Supabase
        id: link
        if: ${{ steps.validate.outcome == 'success' }}
        continue-on-error: true
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Dry run migrations
        id: dry_run
        if: ${{ steps.link.outcome == 'success' }}
        continue-on-error: true
        run: supabase db push --dry-run

      - name: Apply migrations
        id: db_push
        if: ${{ steps.dry_run.outcome == 'success' }}
        continue-on-error: true
        run: supabase db push

      - name: Configure Preview origin
        id: core_secrets
        if: ${{ steps.db_push.outcome == 'success' }}
        continue-on-error: true
        run: supabase secrets set --project-ref "$PROJECT_REF" ADMIN_SITE_ORIGIN="$PREVIEW_ORIGIN"

      - name: Configure optional Gmail
        id: gmail
        if: ${{ steps.core_secrets.outcome == 'success' && env.GMAIL_CLIENT_ID != '' && env.GMAIL_CLIENT_SECRET != '' && env.GMAIL_TOKEN_ENCRYPTION_KEY != '' }}
        continue-on-error: true
        shell: bash
        run: |
          CALLBACK="https://${PROJECT_REF}.supabase.co/functions/v1/gmail-oauth-callback"
          supabase secrets set --project-ref "$PROJECT_REF" GMAIL_CLIENT_ID="$GMAIL_CLIENT_ID" GMAIL_CLIENT_SECRET="$GMAIL_CLIENT_SECRET" GMAIL_REDIRECT_URI="$CALLBACK" GMAIL_TOKEN_ENCRYPTION_KEY="$GMAIL_TOKEN_ENCRYPTION_KEY"

      - name: Deploy Edge Functions
        id: functions
        if: ${{ steps.core_secrets.outcome == 'success' && (steps.gmail.outcome == 'success' || steps.gmail.outcome == 'skipped') }}
        continue-on-error: true
        run: supabase functions deploy --project-ref "$PROJECT_REF"

      - name: Publish result
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATE: ${{ steps.validate.outcome }}
          LINK: ${{ steps.link.outcome }}
          DRY_RUN: ${{ steps.dry_run.outcome }}
          DB_PUSH: ${{ steps.db_push.outcome }}
          CORE: ${{ steps.core_secrets.outcome }}
          GMAIL: ${{ steps.gmail.outcome }}
          FUNCTIONS: ${{ steps.functions.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          STAGE=success; STATE=success
          if [[ "$VALIDATE" != success ]]; then STAGE=validate; STATE=failure
          elif [[ "$LINK" != success ]]; then STAGE=link; STATE=failure
          elif [[ "$DRY_RUN" != success ]]; then STAGE=dry-run; STATE=failure
          elif [[ "$DB_PUSH" != success ]]; then STAGE=db-push; STATE=failure
          elif [[ "$CORE" != success ]]; then STAGE=core-secrets; STATE=failure
          elif [[ "$GMAIL" != success && "$GMAIL" != skipped ]]; then STAGE=gmail; STATE=failure
          elif [[ "$FUNCTIONS" != success ]]; then STAGE=functions; STATE=failure
          fi
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"filitalia/preview-deploy-2.109.1/$STAGE\",\"description\":\"Preview backend pinned CLI: $STAGE\"}"
          [[ "$STATE" == success ]]
