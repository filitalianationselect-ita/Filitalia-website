name: FIL-ITALIA Admin Quality

on:
  pull_request:
    paths:
      - "admin-*.js"
      - "admin-*.html"
      - "admin-light.html"
      - "preview-auth-routing-v1.js"
      - "public-content-bridge-v1.js"
      - "supabase-config.js"
      - "scripts/*.js"
      - "package.json"
      - "netlify.toml"
      - "login.html"
      - "index.html"
      - "events.html"
      - "news.html"
      - "players.html"
      - "staff.html"
      - ".github/workflows/admin-quality.yml"
  push:
    branches:
      - "agent/admin-panel-demo"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -maxdepth 1 -type f -name 'admin-*.js' -print0 | sort -z)
          node --check public-content-bridge-v1.js
          node --check preview-auth-routing-v1.js
          node --check scripts/generate-runtime-config.js
          node --check scripts/audit-admin-assets.js

      - name: Verify admin script references
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('admin-light.html', 'utf8');
          const refs = [...html.matchAll(/src="([^"]+\.js(?:\?[^\"]*)?)"/g)]
            .map(match => match[1])
            .filter(src => !/^https?:\/\//.test(src))
            .map(src => src.split('?')[0]);
          const missing = [...new Set(refs)].filter(file => !fs.existsSync(file));
          if (missing.length) {
            console.error('Local scripts missing from admin-light.html:', missing.join(', '));
            process.exit(1);
          }
          const required = [
            'preview-auth-routing-v1.js',
            'admin-event-catalog-v3.js',
            'admin-core-service-v1.js',
            'admin-event-links-v1.js',
            'admin-event-propagation-v1.js',
            'admin-direct-mail-branded-v2.js',
            'admin-project-audit-v1.js',
            'admin-site-connection-v1.js',
            'admin-deploy-preview-center-v1.js'
          ];
          const notLoaded = required.filter(file => !refs.includes(file));
          if (notLoaded.length) {
            console.error('Required admin modules are not loaded:', notLoaded.join(', '));
            process.exit(1);
          }
          console.log(`${refs.length} local admin script references verified.`);
          NODE

      - name: Report admin asset usage
        run: node scripts/audit-admin-assets.js

      - name: Verify public dynamic bridge
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pages = ['index.html', 'events.html', 'news.html', 'players.html', 'staff.html'];
          const broken = pages.filter(page => {
            if (!fs.existsSync(page)) return true;
            return !fs.readFileSync(page, 'utf8').includes('public-content-bridge-v1.js');
          });
          if (broken.length) {
            console.error('Dynamic public content bridge missing from:', broken.join(', '));
            process.exit(1);
          }
          console.log('Dynamic public bridge verified on all public pages.');
          NODE

      - name: Verify deploy preview runtime config
        env:
          CONTEXT: deploy-preview
          DEPLOY_PRIME_URL: https://deploy-preview-1--filitalia.netlify.app
          FILITALIA_PREVIEW_SUPABASE_URL: https://preview-project.supabase.co
          FILITALIA_PREVIEW_SUPABASE_PUBLISHABLE_KEY: preview_publishable_key
        run: |
          cp supabase-config.js /tmp/supabase-config.original.js
          node scripts/generate-runtime-config.js
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('supabase-config.js', 'utf8');
          const required = [
            'https://deploy-preview-1--filitalia.netlify.app',
            'https://preview-project.supabase.co',
            '"environment": "deploy-preview"',
            '"isPreview": true',
            '"usesPreviewDatabase": true'
          ];
          const missing = required.filter(value => !text.includes(value));
          if (missing.length) {
            console.error('Deploy preview config generation failed:', missing.join(', '));
            process.exit(1);
          }
          console.log('Deploy preview runtime config verified.');
          NODE
          mv /tmp/supabase-config.original.js supabase-config.js

      - name: Verify auth routing stays on preview
        run: |
          node <<'NODE'
          const fs = require('fs');
          const login = fs.readFileSync('login.html', 'utf8');
          const admin = fs.readFileSync('admin-light.html', 'utf8');
          if (!login.includes('preview-auth-routing-v1.js')) throw new Error('Preview auth routing missing from login.html');
          if (!admin.includes('preview-auth-routing-v1.js')) throw new Error('Preview auth routing missing from admin-light.html');
          console.log('Preview auth routing verified.');
          NODE
