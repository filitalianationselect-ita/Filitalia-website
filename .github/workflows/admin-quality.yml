name: FIL-ITALIA Admin Quality

on:
  pull_request:
    paths:
      - "admin-*.js"
      - "admin-*.html"
      - "admin-light.html"
      - "preview-auth-routing-v1.js"
      - "public-content-bridge-v1.js"
      - "supabase-config.js"
      - "supabase/config.toml"
      - "supabase/migrations/*.sql"
      - "supabase/functions/**"
      - "scripts/*.js"
      - "package.json"
      - "netlify.toml"
      - "login.html"
      - "index.html"
      - "events.html"
      - "news.html"
      - "players.html"
      - "staff.html"
      - ".github/workflows/*.yml"
  push:
    branches:
      - "agent/admin-panel-demo"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -maxdepth 1 -type f -name 'admin-*.js' -print0 | sort -z)
          node --check public-content-bridge-v1.js
          node --check preview-auth-routing-v1.js
          node --check scripts/generate-runtime-config.js
          node --check scripts/audit-admin-assets.js

      - name: Verify admin script references
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('admin-light.html', 'utf8');
          const refs = [...html.matchAll(/src="([^"]+\.js(?:\?[^\"]*)?)"/g)]
            .map(match => match[1])
            .filter(src => !/^https?:\/\//.test(src))
            .map(src => src.split('?')[0]);
          const missing = [...new Set(refs)].filter(file => !fs.existsSync(file));
          if (missing.length) {
            console.error('Local scripts missing from admin-light.html:', missing.join(', '));
            process.exit(1);
          }
          const required = [
            'preview-auth-routing-v1.js',
            'admin-event-catalog-v3.js',
            'admin-core-service-v1.js',
            'admin-event-links-v1.js',
            'admin-event-propagation-v1.js',
            'admin-direct-mail-branded-v2.js',
            'admin-project-audit-v1.js',
            'admin-site-connection-v1.js',
            'admin-deploy-preview-center-v1.js'
          ];
          const notLoaded = required.filter(file => !refs.includes(file));
          if (notLoaded.length) {
            console.error('Required admin modules are not loaded:', notLoaded.join(', '));
            process.exit(1);
          }
          console.log(`${refs.length} local admin script references verified.`);
          NODE

      - name: Verify public dynamic bridge
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pages = ['index.html', 'events.html', 'news.html', 'players.html', 'staff.html'];
          const broken = pages.filter(page => {
            if (!fs.existsSync(page)) return true;
            return !fs.readFileSync(page, 'utf8').includes('public-content-bridge-v1.js');
          });
          if (broken.length) {
            console.error('Dynamic public content bridge missing from:', broken.join(', '));
            process.exit(1);
          }
          console.log('Dynamic public bridge verified on all public pages.');
          NODE

      - name: Verify deploy preview runtime config
        env:
          CONTEXT: deploy-preview
          DEPLOY_PRIME_URL: https://deploy-preview-1--filitalia.netlify.app
          FILITALIA_PREVIEW_SUPABASE_URL: https://preview-project.supabase.co
          FILITALIA_PREVIEW_SUPABASE_PUBLISHABLE_KEY: preview_publishable_key
        run: |
          cp supabase-config.js /tmp/supabase-config.original.js
          node scripts/generate-runtime-config.js
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('supabase-config.js', 'utf8');
          const required = [
            'https://deploy-preview-1--filitalia.netlify.app',
            'https://preview-project.supabase.co',
            '"environment": "deploy-preview"',
            '"isPreview": true',
            '"usesPreviewDatabase": true'
          ];
          const missing = required.filter(value => !text.includes(value));
          if (missing.length) {
            console.error('Deploy preview config generation failed:', missing.join(', '));
            process.exit(1);
          }
          console.log('Deploy preview runtime config verified.');
          NODE
          mv /tmp/supabase-config.original.js supabase-config.js

      - name: Verify auth routing stays on preview
        run: |
          node <<'NODE'
          const fs = require('fs');
          const login = fs.readFileSync('login.html', 'utf8');
          const admin = fs.readFileSync('admin-light.html', 'utf8');
          if (!login.includes('preview-auth-routing-v1.js')) throw new Error('Preview auth routing missing from login.html');
          if (!admin.includes('preview-auth-routing-v1.js')) throw new Error('Preview auth routing missing from admin-light.html');
          console.log('Preview auth routing verified.');
          NODE

  asset_audit:
    name: Unused admin files
    runs-on: ubuntu-latest
    steps:
      - name: Clone preview branch quietly
        run: git clone --quiet --depth 1 --branch agent/admin-panel-demo https://github.com/filitalianationselect-ita/Filitalia-website.git source
      - name: Reject unreferenced admin assets
        working-directory: source
        run: node scripts/audit-admin-assets.js

  migration_sql:
    name: Supabase migration SQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare minimal Supabase schemas
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              execute 'create role anon nologin';
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              execute 'create role authenticated nologin';
            end if;
          end
          $$;
          create schema if not exists auth;
          create schema if not exists storage;
          create table if not exists auth.users (
            id uuid primary key default gen_random_uuid(),
            email text
          );
          create or replace function auth.uid()
          returns uuid language sql stable as $$ select null::uuid $$;
          create table if not exists public.profiles (
            id uuid primary key references auth.users(id) on delete cascade,
            email text,
            role text not null default 'player'
              check (role in ('player','parent','coach','coordinator','staff','admin')),
            status text not null default 'pending'
              check (status in ('pending','active','suspended','rejected'))
          );
          create table if not exists storage.buckets (
            id text primary key,
            name text not null,
            public boolean not null default false,
            file_size_limit bigint,
            allowed_mime_types text[]
          );
          create table if not exists storage.objects (
            id uuid primary key default gen_random_uuid(),
            bucket_id text not null,
            name text
          );
          SQL

      - name: Apply consolidated migration twice
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260728090000_filitalia_admin_complete.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260728090000_filitalia_admin_complete.sql

      - name: Verify final database objects
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          select public.is_active_admin();
          select public.is_active_super_admin();
          select to_regclass('public.admin_events') as admin_events;
          select to_regclass('public.admin_news') as admin_news;
          select to_regclass('public.admin_players') as admin_players;
          select to_regclass('public.admin_staff') as admin_staff;
          select to_regclass('public.admin_event_links') as admin_event_links;
          select to_regclass('public.admin_email_campaigns') as admin_email_campaigns;
          select to_regclass('public.event_admin_operations') as event_admin_operations;
          SQL
