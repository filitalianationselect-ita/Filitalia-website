name: Temporary Role Consistency Fix

on:
  push:
    branches: ["agent/admin-panel-demo"]
    paths: [".github/workflows/temporary-role-consistency.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-panel-demo
          fetch-depth: 0

      - name: Align Admin and Super Admin roles
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_required(path, old, new, expected=1):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}: {old[:120]}")
              file.write_text(text.replace(old, new, expected))
              print(f"Patched {path}: {count} occurrence(s)")

          auth_client = Path('auth-client.js')
          text = auth_client.read_text()
          old = 'const allowedAdminRoles = new Set(["player", "parent", "coach", "coordinator", "staff", "admin"]);'
          new = 'const allowedAdminRoles = new Set(["player", "parent", "coach", "coordinator", "staff", "admin", "super_admin"]);'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('auth-client.js: admin role set not found')
          auth_client.write_text(text)

          auth_pages = Path('auth-pages.js')
          text = auth_pages.read_text()
          marker = '  function roleLabel(role) {\n'
          helper = marker + '    if (role === "super_admin") return "Super Admin";\n'
          if 'if (role === "super_admin") return "Super Admin";' not in text:
              if marker not in text:
                  raise SystemExit('auth-pages.js: roleLabel marker missing')
              text = text.replace(marker, helper, 1)

          replacements = [
              ('["player", "parent", "coach", "coordinator", "staff", "admin"].forEach(function (role) {',
               '["player", "parent", "coach", "coordinator", "staff", "admin", "super_admin"].forEach(function (role) {'),
              ('if (profile.status === "active" && profile.role !== "admin") {',
               'if (profile.status === "active" && !["admin", "super_admin"].includes(profile.role)) {'),
              ('if (profile && profile.role === "admin") {',
               'if (profile && ["admin", "super_admin"].includes(profile.role)) {'),
              ('if (profile.role === "admin" && profile.status === "active") {',
               'if (["admin", "super_admin"].includes(profile.role) && profile.status === "active") {'),
              ('if (lastProfile && lastProfile.role === "admin" && lastProfile.status === "active") loadAdminDashboard();',
               'if (lastProfile && ["admin", "super_admin"].includes(lastProfile.role) && lastProfile.status === "active") loadAdminDashboard();')
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'auth-pages.js pattern missing: {old}')
          auth_pages.write_text(text)

          player_cards = Path('player-card-admin.js')
          text = player_cards.read_text()
          old = 'if (!profile || profile.role !== "admin" || profile.status !== "active") return;'
          new = 'if (!profile || !["admin", "super_admin"].includes(profile.role) || profile.status !== "active") return;'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('player-card-admin.js role guard missing')
          player_cards.write_text(text)

          account = Path('account.html')
          text = account.read_text()
          text = text.replace('data-role-section="player,parent,coach,coordinator,staff,admin"', 'data-role-section="player,parent,coach,coordinator,staff,admin,super_admin"')
          text = text.replace('auth-client.js?v=1001', 'auth-client.js?v=1002')
          text = text.replace('auth-admin-fix.js?v=1001', 'auth-admin-fix.js?v=1002')
          text = text.replace('auth-pages.js?v=1001', 'auth-pages.js?v=1002')
          text = text.replace('player-card-admin.js?v=1', 'player-card-admin.js?v=2')
          account.write_text(text)

          admin_fix = Path('auth-admin-fix.js')
          text = admin_fix.read_text()
          anchor = '''    if (upper.includes("CANNOT_CHANGE_SELF")) {
              return "Per sicurezza non puoi modificare il tuo stesso account amministratore.";
            }
'''
          addition = anchor + '''    if (upper.includes("SUPER_ADMIN_REQUIRED")) {
              return "Solo un Super Admin può assegnare o modificare il ruolo Super Admin.";
            }
            if (upper.includes("CANNOT_REMOVE_LAST_SUPER_ADMIN")) {
              return "Deve rimanere almeno un Super Admin attivo nel sistema.";
            }
'''
          if 'SUPER_ADMIN_REQUIRED' not in text:
              if anchor not in text:
                  raise SystemExit('auth-admin-fix.js error insertion point missing')
              text = text.replace(anchor, addition, 1)
          admin_fix.write_text(text)

          Path('.github/workflows/temporary-role-consistency.yml').unlink()
          PY

      - name: Verify role consistency
        run: |
          node --check auth-client.js
          node --check auth-pages.js
          node --check auth-admin-fix.js
          node --check player-card-admin.js
          grep -F '"super_admin"' auth-client.js
          grep -F '["admin", "super_admin"].includes(profile.role)' auth-pages.js
          grep -F '["admin", "super_admin"].includes(profile.role)' player-card-admin.js
          grep -F 'player-card-admin.js?v=2' account.html
          test ! -e .github/workflows/temporary-role-consistency.yml

      - name: Commit final role support
        run: |
          git config user.name "FIL-ITALIA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Align Admin and Super Admin access across account UI"
          git push origin HEAD:agent/admin-panel-demo
