name: Player Media Feature E2E

on:
  push:
    branches:
      - feature/player-photo-video-submissions
    paths:
      - account-player-media-v1.js
      - account.html
      - admin-player-profile-v1.js
      - player-profile-final-v1.js
      - player-profile-final-v1.css
      - player.html
      - .github/workflows/player-media-feature-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Start isolated Supabase
        run: |
          set -euo pipefail
          supabase start
          supabase status -o env > /tmp/supabase.env

      - name: Seed Player, Admin and public profile link
        run: |
          set -euo pipefail
          set -a
          source /tmp/supabase.env
          set +a
          API_URL="$API_URL" ANON_KEY="$ANON_KEY" SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" node <<'NODE'
          const fs=require('fs');
          const API=process.env.API_URL, ANON=process.env.ANON_KEY, SERVICE=process.env.SERVICE_ROLE_KEY;
          const password='Player-Media-E2E-2026!';
          async function req(path,options={}){const r=await fetch(API+path,options);const text=await r.text();let data;try{data=text?JSON.parse(text):null}catch(_){data=text}if(!r.ok)throw new Error(path+' '+r.status+' '+text);return data}
          const service={apikey:SERVICE,Authorization:'Bearer '+SERVICE,'Content-Type':'application/json'};
          async function user(email,meta){return req('/auth/v1/admin/users',{method:'POST',headers:service,body:JSON.stringify({email,password,email_confirm:true,user_metadata:meta})})}
          (async()=>{
            const signup=await req('/auth/v1/signup',{method:'POST',headers:{apikey:ANON,'Content-Type':'application/json'},body:JSON.stringify({email:'fresh.signup@filitalia.test',password,data:{first_name:'Fresh',last_name:'Signup',requested_role:'player',language:'it'}})});
            if(!signup?.user?.id)throw new Error('Fresh signup did not create an Auth user');
            const fresh=await req('/rest/v1/profiles?id=eq.'+signup.user.id+'&select=id,email,requested_role,role,status',{headers:service});
            if(!Array.isArray(fresh)||fresh.length!==1||fresh[0].requested_role!=='player'||fresh[0].role!=='user'||fresh[0].status!=='pending')throw new Error('Fresh signup profile state invalid '+JSON.stringify(fresh));
            const player=await user('media.player@filitalia.test',{first_name:'Media',last_name:'Player',requested_role:'player',language:'it'});
            const admin=await user('media.admin@filitalia.test',{first_name:'Media',last_name:'Admin',requested_role:'staff',language:'it'});
            await req('/rest/v1/profiles?id=eq.'+player.id,{method:'PATCH',headers:{...service,Prefer:'return=representation'},body:JSON.stringify({role:'player',status:'active'})});
            await req('/rest/v1/profiles?id=eq.'+admin.id,{method:'PATCH',headers:{...service,Prefer:'return=representation'},body:JSON.stringify({role:'admin',status:'active'})});
            await req('/rest/v1/player_public_profile_settings',{method:'POST',headers:{...service,Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify({player_id:'mico-miguel-manliclic',linked_user_id:player.id,bio:{it:'',en:'',ph:''},camps:[],evaluations:{},skills_public:false,photos:[]})});
            fs.writeFileSync('/tmp/media-e2e-seed.json',JSON.stringify({playerId:player.id,adminId:admin.id,password},null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Point site to local Supabase
        run: |
          set -euo pipefail
          set -a
          source /tmp/supabase.env
          set +a
          API_URL="$API_URL" ANON_KEY="$ANON_KEY" node <<'NODE'
          const fs=require('fs');
          let s=fs.readFileSync('supabase-config.js','utf8');
          s=s.replace(/"supabaseUrl":\s*"[^"]*"/,'"supabaseUrl": '+JSON.stringify(process.env.API_URL))
             .replace(/"supabasePublishableKey":\s*"[^"]*"/,'"supabasePublishableKey": '+JSON.stringify(process.env.ANON_KEY))
             .replace(/"siteUrl":\s*"[^"]*"/,'"siteUrl": "http://127.0.0.1:4173"')
             .replace(/"environment":\s*"[^"]*"/,'"environment": "player-media-e2e"');
          fs.writeFileSync('supabase-config.js',s);
          NODE

      - name: Browser test Player upload and public display
        run: |
          set -euo pipefail
          npm install --no-save --silent playwright-core
          CHROME_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          test -n "$CHROME_PATH"
          python3 -m http.server 4173 >/tmp/media-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/account.html >/dev/null && break; sleep 1; done
          set -a
          source /tmp/supabase.env
          set +a
          CHROME_PATH="$CHROME_PATH" API_URL="$API_URL" ANON_KEY="$ANON_KEY" SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" node <<'NODE'
          const {chromium}=require('playwright-core');
          const fs=require('fs');
          const seed=JSON.parse(fs.readFileSync('/tmp/media-e2e-seed.json','utf8'));
          const API=process.env.API_URL,SERVICE=process.env.SERVICE_ROLE_KEY;
          const service={apikey:SERVICE,Authorization:'Bearer '+SERVICE,'Content-Type':'application/json'};

          async function api(path,options={}){const r=await fetch(API+path,options);const text=await r.text();let data;try{data=text?JSON.parse(text):null}catch(_){data=text}if(!r.ok)throw new Error(path+' '+r.status+' '+text);return data}

          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1280,height:950}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));

            await page.goto('http://127.0.0.1:4173/login.html?mediae2e=1',{waitUntil:'networkidle',timeout:120000});
            await page.waitForFunction(()=>window.FilitaliaAuth&&window.FilitaliaAuth.configured);
            const login=await page.evaluate(async p=>{const r=await window.FilitaliaAuth.signIn('media.player@filitalia.test',p);return Boolean(r?.data?.session)},seed.password);
            if(!login)throw new Error('Player browser login failed');

            await page.goto('http://127.0.0.1:4173/account.html?mediae2e=1',{waitUntil:'networkidle',timeout:120000});
            await page.waitForSelector('#playerMediaSection:not([hidden])',{timeout:20000});
            if(!await page.locator('#playerMediaVideoTab').count())throw new Error('Video button missing');

            await page.click('#playerMediaVideoTab');
            await page.fill('#playerVideoUrl','https://www.youtube.com/watch?v=filitalia-e2e');
            await page.fill('#playerVideoCaption','Highlights E2E');
            await page.click('#playerVideoSubmit');
            await page.waitForFunction(()=>/Video inviato/i.test(document.querySelector('#playerMediaStatus')?.textContent||''),{timeout:10000});

            const afterVideo=await page.evaluate(async()=>{
              const r=await window.FilitaliaAuth.client.from('player_profile_media').select('*').order('created_at');
              return {error:r.error&&r.error.message,rows:r.data||[]};
            });
            if(afterVideo.error)throw new Error(afterVideo.error);
            const video=afterVideo.rows.find(r=>r.public_url&&r.caption==='Highlights E2E');
            if(!video||video.status!=='pending'||video.storage_path)throw new Error('Pending video row invalid '+JSON.stringify(video));

            await page.click('#playerMediaPhotoTab');
            await page.locator('#playerGalleryInput').setInputFiles({name:'e2e-photo.png',mimeType:'image/png',buffer:Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=','base64')});
            await page.click('#playerGalleryUpload');
            await page.waitForFunction(()=>/Foto caricate/i.test(document.querySelector('#playerMediaStatus')?.textContent||''),{timeout:15000});

            const afterPhoto=await page.evaluate(async()=>{
              const r=await window.FilitaliaAuth.client.from('player_profile_media').select('*').order('created_at');
              return {error:r.error&&r.error.message,rows:r.data||[]};
            });
            if(afterPhoto.error)throw new Error(afterPhoto.error);
            const photo=afterPhoto.rows.find(r=>r.storage_path);
            if(!photo||photo.status!=='pending'||!photo.storage_path.includes('/gallery/'))throw new Error('Pending photo row invalid '+JSON.stringify(photo));

            await page.click('#playerMediaVideoTab');
            await page.fill('#playerVideoUrl','https://example.com/not-allowed');
            await page.click('#playerVideoSubmit');
            await page.waitForFunction(()=>/YouTube o Instagram/i.test(document.querySelector('#playerMediaStatus')?.textContent||''),{timeout:5000});
            const countAfterBad=await page.evaluate(async()=>{const r=await window.FilitaliaAuth.client.from('player_profile_media').select('id',{count:'exact',head:true});return r.count});
            if(countAfterBad!==2)throw new Error('Invalid video link inserted');

            const ids=afterPhoto.rows.map(r=>r.id);
            await api('/rest/v1/player_profile_media?id=in.('+ids.join(',')+')',{method:'PATCH',headers:{...service,Prefer:'return=representation'},body:JSON.stringify({status:'approved',reviewed_by:seed.adminId,reviewed_at:new Date().toISOString()})});

            await page.screenshot({path:'/tmp/player-media-account.png',fullPage:true});

            const publicPage=await browser.newPage({viewport:{width:1280,height:950}});
            await publicPage.goto('http://127.0.0.1:4173/player.html?id=mico-miguel-manliclic&mediae2e=1',{waitUntil:'networkidle',timeout:120000});
            await publicPage.waitForSelector('.player-videos-panel:not([hidden])',{timeout:20000});
            const publicState=await publicPage.evaluate(()=>({
              videoText:document.querySelector('.player-video-card strong')?.textContent?.trim(),
              videoHref:document.querySelector('.player-video-card')?.href||'',
              thumbs:document.querySelectorAll('.player-gallery-thumb').length,
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
            }));
            if(publicState.videoText!=='Highlights E2E')throw new Error('Approved video not rendered '+JSON.stringify(publicState));
            if(!publicState.videoHref.includes('youtube.com/watch?v=filitalia-e2e'))throw new Error('Approved video href wrong');
            if(publicState.thumbs<2)throw new Error('Approved photo not present in gallery '+JSON.stringify(publicState));
            if(publicState.overflow>3)throw new Error('Public desktop overflow '+publicState.overflow);

            const mobile=await browser.newPage({viewport:{width:390,height:844}});
            await mobile.goto('http://127.0.0.1:4173/player.html?id=mico-miguel-manliclic&mediae2e=mobile',{waitUntil:'networkidle',timeout:120000});
            await mobile.waitForSelector('.player-videos-panel:not([hidden])',{timeout:20000});
            const mobileState=await mobile.evaluate(()=>({overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,videoVisible:getComputedStyle(document.querySelector('.player-videos-panel')).display!=='none'}));
            if(mobileState.overflow>3||!mobileState.videoVisible)throw new Error('Mobile public media failed '+JSON.stringify(mobileState));
            await mobile.screenshot({path:'/tmp/player-media-public-mobile.png',fullPage:true});

            fs.writeFileSync('/tmp/player-media-feature-result.json',JSON.stringify({result:'PASS',videoId:video.id,photoId:photo.id,publicState,mobileState,pageErrors:errors},null,2));
            await browser.close();
          })().catch(e=>{fs.writeFileSync('/tmp/player-media-feature-result.json',JSON.stringify({result:'FAIL',error:String(e.stack||e)},null,2));console.error(e);process.exit(1)});
          NODE

      - name: Static Admin review checks
        run: |
          node --check account-player-media-v1.js
          node --check admin-player-profile-v1.js
          node --check player-profile-final-v1.js
          grep -F "FOTO E VIDEO DA APPROVARE" admin-player-profile-v1.js
          grep -F "mediaOwners(rows)" admin-player-profile-v1.js
          grep -F "APPROVA" admin-player-profile-v1.js
          grep -F "RIFIUTA" admin-player-profile-v1.js

      - name: Print result
        if: always()
        run: cat /tmp/player-media-feature-result.json || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-media-feature-e2e
          path: |
            /tmp/player-media-feature-result.json
            /tmp/player-media-account.png
            /tmp/player-media-public-mobile.png
          if-no-files-found: warn
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true
