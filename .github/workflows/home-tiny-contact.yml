name: FIL-ITALIA Tiny Home Contact Sheet

on:
  push:
    branches: ["agent/admin-panel-demo"]
    paths:
      - ".github/workflows/home-tiny-contact.yml"

permissions:
  contents: write

jobs:
  tiny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-panel-demo
      - name: Build tiny contact sheet
        run: |
          python3 -m pip install --quiet pillow
          python3 <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          names=['top','players','gallery','staff','news','events']
          labels=['HOME','PLAYERS','MEDIA','STAFF','NEWS','EVENTI']
          canvas=Image.new('RGB',(320,330),'white')
          draw=ImageDraw.Draw(canvas)
          for index,(name,label) in enumerate(zip(names,labels)):
              image=Image.open(f'visual-review/panel-{name}.jpg').convert('RGB')
              image=ImageOps.fit(image,(150,90),method=Image.Resampling.LANCZOS)
              x=5+(index%2)*160
              y=5+(index//2)*108
              draw.text((x,y),label,fill='black')
              canvas.paste(image,(x,y+14))
          canvas.save('/tmp/tiny-home.jpg',quality=15,optimize=True)
          PY
          rm -f visual-review/tiny-contact-part-*
          base64 -w 0 /tmp/tiny-home.jpg > /tmp/tiny-home.b64
          split -b 4000 -d -a 2 /tmp/tiny-home.b64 visual-review/tiny-contact-part-
          git config user.name "filitalia-visual-bot"
          git config user.email "actions@users.noreply.github.com"
          git add visual-review
          git commit -m "test: save tiny horizontal contact sheet"
          git push origin HEAD:agent/admin-panel-demo
