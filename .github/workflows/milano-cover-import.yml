name: Milan cover from Canva
on:
  push:
    branches:
      - feature/milano-talent-id-nov-2026
    paths:
      - .github/workflows/milano-cover-import.yml
permissions:
  contents: write
jobs:
  import-cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public Canva preview
        env:
          CANVA_VIEW_URL: https://www.canva.com/d/pmIH2ioF0weiH-d
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          import html, os, re, urllib.request
          from PIL import Image
          from io import BytesIO
          url = os.environ["CANVA_VIEW_URL"]
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
          page = urllib.request.urlopen(req, timeout=35).read().decode("utf-8", "replace")
          match = re.search(r'<meta[^>]+(?:property|name)=["\'](?:og:image|twitter:image)["\'][^>]*content=["\']([^"\']+)',page)
          if not match:
              match = re.search(r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+(?:property|name)=["\'](?:og:image|twitter:image)["\']',page)
          if not match: raise RuntimeError("Canva public page lacks OG image")
          image_url = html.unescape(match.group(1))
          img = Image.open(BytesIO(urllib.request.urlopen(urllib.request.Request(image_url, headers={"User-Agent":"Mozilla/5.0"}),timeout=35).read())).convert("RGB")
          w,h = img.size
          print("Canva poster source image dimensions",w,h)
          if h < w * 1.15: raise RuntimeError("Canva image not portrait poster; aborting")
          os.makedirs("images",exist_ok=True)
          img.save("images/talent-id-milano-2026.jpg", "JPEG", quality=85, optimize=True)
          PY
          test "$(stat -c %s images/talent-id-milano-2026.jpg)" -gt 30000
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add images/talent-id-milano-2026.jpg
          git commit -m 'Use real FIL-EURO Milan event poster from Canva'
          git push origin HEAD:feature/milano-talent-id-nov-2026
