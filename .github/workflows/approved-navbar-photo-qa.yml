name: Approved Navbar and Photo QA

on:
  push:
    branches:
      - fix/approved-navbar-20261005
    paths:
      - .github/workflows/approved-navbar-photo-qa.yml
      - site-approved-navbar-v1.css
      - site-global-polish-v3.js
      - site-photo-fit-v1.css
      - site-photo-fit-v1.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check site-global-polish-v3.js
          node --check site-photo-fit-v1.js
      - name: Browser driver
        run: |
          npm install --no-save --silent playwright-core
          CHROME_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Serve
        run: |
          python3 -m http.server 4173 >/tmp/filitalia-http.log 2>&1 &
          echo $! > /tmp/filitalia-http.pid
      - name: Test navbar and smart photos
        run: |
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const fail = m => { throw new Error(m); };
          const wait = ms => new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox']});
            async function pageFor(width,height,name){
              const p=await browser.newPage({viewport:{width,height}});
              await p.goto('http://127.0.0.1:4173/index.html?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});
              await p.waitForFunction(()=>document.body.classList.contains('fil-final-site'),null,{timeout:30000});
              await p.waitForTimeout(1200);
              const state=await p.evaluate(()=>{
                const nav=document.querySelector('.navbar.fil-final-navbar');
                const actions=document.querySelector('.fil-final-actions');
                const langs=actions?.querySelector('.language-switch');
                const socials=document.querySelector('.fil-global-socials');
                const auth=document.querySelector('.fil-final-auth');
                const nr=nav?.getBoundingClientRect();
                const ar=actions?.getBoundingClientRect();
                return {
                  nav:nr&&{top:nr.top,bottom:nr.bottom,height:nr.height},
                  actions:ar&&{top:ar.top,bottom:ar.bottom,height:ar.height},
                  languages:langs?getComputedStyle(langs).display:null,
                  socials:socials?getComputedStyle(socials).display:null,
                  auth:auth?getComputedStyle(auth).display:null,
                  toggleCount:document.querySelectorAll('.fil-mobile-language-toggle').length,
                  overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
                };
              });
              if(state.toggleCount!==0)fail(name+': old floating language toggle still exists');
              if(state.overflow>3)fail(name+': horizontal overflow '+state.overflow);
              if(width>900){
                if(state.languages==='none'||state.socials==='none'||state.auth==='none')fail(name+': desktop actions not all visible');
                if(!state.nav||!state.actions||state.actions.top<state.nav.top-1||state.actions.bottom>state.nav.bottom+1)fail(name+': actions escaped navbar');
              }
              await p.screenshot({path:name+'.png',fullPage:false});
              return p;
            }
            const desktop=await pageFor(1440,900,'desktop');
            await desktop.close();
            const laptop=await pageFor(1100,800,'laptop');
            await laptop.close();

            const mobile=await pageFor(390,844,'mobile');
            await mobile.click('.mobile-menu-button');
            await mobile.waitForTimeout(150);
            const mobileState=await mobile.evaluate(()=>({
              menu:getComputedStyle(document.querySelector('#navLinks')).display,
              langs:getComputedStyle(document.querySelector('.fil-mobile-language-menu')).display,
              topLang:document.querySelector('.fil-final-actions > .language-switch')?getComputedStyle(document.querySelector('.fil-final-actions > .language-switch')).display:null
            }));
            if(mobileState.menu==='none')fail('mobile: menu did not open');
            if(mobileState.langs==='none')fail('mobile: IT/EN/PH missing inside menu');
            if(mobileState.topLang!=='none')fail('mobile: top language controls still crowd navbar');
            await mobile.screenshot({path:'mobile-open.png',fullPage:false});

            await mobile.evaluate(()=>{
              const card=document.createElement('div'); card.className='fil-media-card';
              const tall=document.createElement('img');
              tall.id='qaTall'; tall.src='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="300"><rect width="100" height="300" fill="green"/></svg>');
              card.appendChild(tall); document.body.appendChild(card);
              const card2=document.createElement('div'); card2.className='fil-media-card';
              const wide=document.createElement('img');
              wide.id='qaWide'; wide.src='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="100"><rect width="300" height="100" fill="green"/></svg>');
              card2.appendChild(wide); document.body.appendChild(card2);
            });
            await mobile.waitForFunction(()=>document.querySelector('#qaTall')?.classList.contains('fil-smart-contain')&&document.querySelector('#qaWide')?.classList.contains('fil-smart-contain'),null,{timeout:10000});
            const fit=await mobile.evaluate(()=>({
              tall:getComputedStyle(document.querySelector('#qaTall')).objectFit,
              wide:getComputedStyle(document.querySelector('#qaWide')).objectFit
            }));
            if(fit.tall!=='contain'||fit.wide!=='contain')fail('smart photo contain not applied');
            fs.writeFileSync('qa-result.json',JSON.stringify({result:'PASS',mobileState,fit},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-navbar-photo-qa
          path: |
            desktop.png
            laptop.png
            mobile-open.png
            qa-result.json
          retention-days: 7
