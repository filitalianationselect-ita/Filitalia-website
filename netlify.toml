[build]
  publish = "."
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

[[redirects]]
  from = "/admin"
  to = "/admin-light.html"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/home-gallery-full-v1.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/home-gallery-full-v1.css"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/public-media-v1.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/public-media-v1.css"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/admin-light.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/login.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/account.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/reset-password.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow, noarchive"
