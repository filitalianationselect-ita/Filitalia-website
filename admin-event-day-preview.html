<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIL-ITALIA Admin · Event Day</title>
<style>
:root{--bg:#e9eef5;--side:#dce6f1;--card:#fffdf8;--ink:#17233a;--muted:#69758a;--line:#cbd6e3;--blue:#274f8f;--blue2:#e7eef9;--green:#16774a;--greenbg:#e5f5ec;--amber:#9a6410;--amberbg:#fff3d6;--shadow:0 14px 40px rgba(32,54,87,.09)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:var(--side);border-right:1px solid var(--line);padding:24px 18px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:12px;align-items:center;margin:0 8px 30px}.logo{width:42px;height:42px;border-radius:14px;background:var(--blue);display:grid;place-items:center;color:#fff;font-weight:900}.brand strong{display:block}.brand small{color:var(--muted)}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:12px;color:#445168;cursor:pointer}.nav button.active,.nav button:hover{background:rgba(255,255,255,.72);color:var(--blue);font-weight:800}.main{padding:28px}.topbar{display:grid;grid-template-columns:minmax(220px,1fr) minmax(280px,520px) auto;gap:16px;align-items:center}.crumb{font-size:14px;color:var(--muted)}h1{font-size:30px;margin:5px 0 0}.global-search input{width:100%;height:48px;border:1px solid var(--line);border-radius:15px;padding:0 16px;background:#fff;box-shadow:0 8px 24px rgba(32,54,87,.07)}.actions{display:flex;gap:8px}.btn,.quick{border:1px solid var(--line);background:var(--card);padding:10px 14px;border-radius:11px;cursor:pointer;color:var(--ink);font-weight:750}.btn.event,.quick.main{background:var(--blue);border-color:var(--blue);color:#fff}.hero{margin-top:20px;background:linear-gradient(135deg,#fffdf8,#eef4fb);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}.hero-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);margin-top:9px;font-size:14px}.mode-switch{display:flex;background:#dfe7f0;border-radius:13px;padding:4px}.mode-switch button{border:0;background:transparent;padding:9px 13px;border-radius:10px;font-weight:800;color:var(--muted);cursor:pointer}.mode-switch button.active{background:#fff;color:var(--blue)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.stat{background:rgba(255,255,255,.78);border:1px solid var(--line);padding:15px;border-radius:15px}.stat span{display:block;color:var(--muted);font-size:13px}.stat strong{font-size:26px}.quickbar{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.workspace{display:grid;grid-template-columns:minmax(330px,430px) 1fr;gap:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.panel-head{padding:18px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font-size:18px}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.filter{border:1px solid var(--line);background:#fff;padding:7px 10px;border-radius:999px;font-size:12px;cursor:pointer}.filter.active{background:var(--blue2);border-color:#91a9ce;color:var(--blue);font-weight:800}.players{padding:10px;display:grid;gap:8px;max-height:610px;overflow:auto}.player{border:1px solid transparent;background:#f8fafc;border-radius:15px;padding:13px;cursor:pointer;display:grid;grid-template-columns:44px 1fr auto;gap:11px;align-items:center}.player:hover,.player.active{border-color:#91a9ce;background:var(--blue2)}.avatar{width:44px;height:44px;border-radius:14px;background:#d7e0eb;display:grid;place-items:center;font-weight:900;color:var(--blue)}.player strong{display:block}.player small{color:var(--muted)}.pill{font-size:11px;padding:5px 8px;border-radius:999px;font-weight:800}.done,.paid{background:var(--greenbg);color:var(--green)}.pending{background:var(--amberbg);color:var(--amber)}.todo{background:#edf1f6;color:#67758a}.detail{padding:22px}.profile{display:flex;gap:15px;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line)}.profile .avatar{width:64px;height:64px;border-radius:19px;font-size:21px}.profile h2{margin:0 0 4px}.profile p{margin:0;color:var(--muted)}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin:18px 0}.info{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fbfcfe}.info span{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.checklist{display:grid;gap:10px}.task{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:13px}.task-actions button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;cursor:pointer;font-weight:800}.task-actions button.active{background:var(--greenbg);color:var(--green);border-color:#9bd1b5}.notes{width:100%;min-height:92px;border:1px solid var(--line);border-radius:13px;padding:12px;margin-top:14px;resize:vertical}.empty{text-align:center;padding:46px;color:var(--muted)}.toast{position:fixed;right:24px;bottom:24px;background:#17233a;color:#fff;padding:13px 16px;border-radius:12px;opacity:0;transform:translateY(12px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}body.event-mode{--bg:#17233a;--side:#101827;--card:#1d2a40;--ink:#f5f8fc;--muted:#aebbd0;--line:#33445f;--blue:#73a2ef;--blue2:#263c5d;--greenbg:#183c2d;--amberbg:#463819}body.event-mode .hero{background:linear-gradient(135deg,#1d2a40,#213451)}body.event-mode .global-search input,body.event-mode .quick,body.event-mode .filter,body.event-mode .task-actions button{background:#25344d;color:var(--ink)}body.event-mode .player,body.event-mode .info{background:#223149}.event-only{display:none}body.event-mode .event-only{display:block}body.event-mode .management-only{display:none}
@media(max-width:1100px){.topbar{grid-template-columns:1fr auto}.global-search{grid-column:1/-1}.workspace{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.app{display:block}.sidebar{position:static;height:auto;overflow:auto}.main{padding:16px}.topbar{display:flex;flex-direction:column;align-items:stretch}.hero-top{flex-direction:column}.stats{grid-template-columns:1fr 1fr}.detail-grid{grid-template-columns:1fr}.task{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><div class="logo">FI</div><div><strong>FIL-ITALIA</strong><small>Management</small></div></div><nav class="nav"><button>⌂ Dashboard</button><button class="active">🏀 Eventi</button><button>👥 Giocatori</button><button>📝 Registrazioni</button><button>✉️ Email</button><button>💳 Pagamenti</button><button>⚙️ Impostazioni</button></nav></aside>
<main class="main">
<div class="topbar"><div><div class="crumb" id="crumb">Eventi</div><h1 id="eventTitle">Camp</h1></div><div class="global-search"><input id="search" placeholder="Cerca giocatore, email, categoria o anno…"></div><div class="actions"><button class="btn" onclick="toast('Nuova registrazione: prossimo step')">＋ Iscrizione</button><button class="btn event" onclick="toggleMode()" id="modeButton">🎯 Event Day</button></div></div>
<section class="hero"><div class="hero-top"><div><strong>FIL-EURO Talent ID Camp</strong><div class="meta"><span id="eventDate"></span><span id="eventVenue"></span><span id="eventId"></span></div></div><div class="mode-switch"><button id="manageMode" class="active" onclick="setMode(false)">Gestione</button><button id="eventMode" onclick="setMode(true)">Event Day</button></div></div><div class="stats"><div class="stat"><span>Iscritti</span><strong id="registeredStat">0</strong></div><div class="stat"><span>Pagati</span><strong id="paidStat">0</strong></div><div class="stat"><span>Check-in</span><strong id="checkinStat">0</strong></div><div class="stat"><span>Maglie consegnate</span><strong id="shirtStat">0</strong></div></div></section>
<div class="quickbar"><button class="quick main" onclick="toast('Nuova registrazione: prossimo step')">＋ Aggiungi registrazione</button><button class="quick management-only" onclick="toast('Email collettiva: prossimo step')">✉️ Invia email</button><button class="quick management-only" onclick="resetDemo()">↺ Ripristina dati demo</button><button class="quick event-only" onclick="markAllPresent()">✓ Segna tutti presenti</button></div>
<section class="workspace"><div class="panel"><div class="panel-head"><h2>Partecipanti</h2><div class="filters"><button class="filter active" data-filter="all">Tutti</button><button class="filter" data-filter="notchecked">Da registrare</button><button class="filter" data-filter="checked">Arrivati</button><button class="filter" data-filter="pending">Da pagare</button><button class="filter" data-filter="U12">U12</button><button class="filter" data-filter="U14">U14</button><button class="filter" data-filter="U16">U16</button><button class="filter" data-filter="U18">U18</button></div></div><div id="players" class="players"></div></div><div id="detail" class="panel"></div></section>
</main></div><div id="toast" class="toast"></div>
<script src="data/admin-registrations-roma.js"></script>
<script>
const STORAGE_KEY='filitalia-admin-roma-v1';
const sourceData=window.FILITALIA_ADMIN_REGISTRATIONS||[];
const eventInfo=window.FILITALIA_ADMIN_EVENT||{};
let data=loadData();
let selected=data[0]?.id||null,filter='all',eventMode=false;
function loadData(){try{const saved=localStorage.getItem(STORAGE_KEY);return saved?JSON.parse(saved):structuredClone(sourceData)}catch(e){return JSON.parse(JSON.stringify(sourceData))}}
function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}
function initials(n){return n.split(' ').map(x=>x[0]).slice(0,2).join('')}
function visible(p,q){const matches=`${p.name} ${p.email} ${p.cat} ${p.year} ${p.parent}`.toLowerCase().includes(q);const f=filter==='all'||filter===p.cat||filter===p.status||(filter==='checked'&&p.checked)||(filter==='notchecked'&&!p.checked);return matches&&f}
function renderEvent(){document.getElementById('crumb').textContent=`Eventi / ${eventInfo.city||''} 2026`;document.getElementById('eventTitle').textContent=eventInfo.title||'Camp';document.getElementById('eventDate').textContent=`📅 ${eventInfo.date||''} · ${eventInfo.time||''}`;document.getElementById('eventVenue').textContent=`📍 ${eventInfo.venue||''}`;document.getElementById('eventId').textContent=`🆔 ${eventInfo.id||''}`}
function renderList(){const q=document.getElementById('search').value.toLowerCase();const list=data.filter(p=>visible(p,q));document.getElementById('players').innerHTML=list.length?list.map(p=>`<div class="player ${p.id===selected?'active':''}" onclick="selectPlayer(${p.id})"><div class="avatar">${initials(p.name)}</div><div><strong>${p.name}</strong><small>${p.cat} · ${p.year} · Maglia ${p.shirt}</small></div><span class="pill ${p.checked?'done':'todo'}">${p.checked?'Arrivato':'Da registrare'}</span></div>`).join(''):'<div class="empty">Nessun partecipante trovato</div>'}
function task(label,key,p){return `<div class="task"><div><strong>${label}</strong><br><small>${p[key]?'Completato':'Da completare'}</small></div><div class="task-actions"><button class="${p[key]?'active':''}" onclick="toggleTask('${key}',${p.id})">${p[key]?'✓ Fatto':'Segna fatto'}</button></div></div>`}
function renderDetail(){const p=data.find(x=>x.id===selected);if(!p){document.getElementById('detail').innerHTML='<div class="empty">Seleziona un partecipante</div>';return}document.getElementById('detail').innerHTML=`<div class="detail"><div class="profile"><div class="avatar">${initials(p.name)}</div><div><h2>${p.name}</h2><p>${p.cat} · ${p.year} · ${p.status==='paid'?'Pagamento verificato':'Pagamento in attesa'}</p></div></div><div class="detail-grid management-only"><div class="info"><span>Email</span><strong>${p.email}</strong></div><div class="info"><span>Genitore</span><strong>${p.parent}</strong></div><div class="info"><span>Categoria</span><strong>${p.cat}</strong></div><div class="info"><span>Taglia maglia</span><strong>${p.shirt}</strong></div></div><div class="checklist">${task('Pagamento verificato','paidFlag',{...p,paidFlag:p.status==='paid'})}${task('Certificato presente','certificate',p)}${task('Check-in','checked',p)}${task('Maglia consegnata','shirtDone',p)}${task('Presenza confermata','present',p)}${task('Foto giocatore','photo',p)}</div><textarea class="notes" placeholder="Note rapide…" onchange="saveNotes(${p.id},this.value)">${p.notes||''}</textarea></div>`}
function selectPlayer(id){selected=id;renderList();renderDetail()}
function toggleTask(key,id){const p=data.find(x=>x.id===id);if(key==='paidFlag'){p.status=p.status==='paid'?'pending':'paid'}else{p[key]=!p[key]}persist();renderList();renderDetail();updateStats();toast('Operazione salvata')}
function saveNotes(id,value){data.find(x=>x.id===id).notes=value;persist();toast('Nota salvata')}
function updateStats(){document.getElementById('registeredStat').textContent=data.length;document.getElementById('paidStat').textContent=data.filter(x=>x.status==='paid').length;document.getElementById('checkinStat').textContent=data.filter(x=>x.checked).length;document.getElementById('shirtStat').textContent=data.filter(x=>x.shirtDone).length}
function setMode(on){eventMode=on;document.body.classList.toggle('event-mode',on);document.getElementById('manageMode').classList.toggle('active',!on);document.getElementById('eventMode').classList.toggle('active',on);document.getElementById('modeButton').textContent=on?'← Torna a Gestione':'🎯 Event Day';renderDetail()}
function toggleMode(){setMode(!eventMode)}
function markAllPresent(){data.forEach(x=>{x.checked=true;x.present=true});persist();renderList();renderDetail();updateStats();toast('Tutti segnati presenti')}
function resetDemo(){localStorage.removeItem(STORAGE_KEY);data=JSON.parse(JSON.stringify(sourceData));selected=data[0]?.id||null;renderList();renderDetail();updateStats();toast('Dati demo ripristinati')}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
document.getElementById('search').addEventListener('input',renderList);document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;renderList()});renderEvent();renderList();renderDetail();updateStats();
</script>
</body>
</html>
