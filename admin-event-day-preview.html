<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIL-ITALIA Admin · Roma</title><style>:root{--bg:#edf2f7;--card:#fff;--ink:#182235;--muted:#6d788a;--line:#d7dee8;--blue:#27518f;--green:#17784a;--amber:#a36a0d}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.wrap{max-width:1180px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center}.badge{background:#fff1c7;color:#795400;padding:8px 12px;border-radius:999px;font-weight:800;font-size:13px}.hero,.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 32px rgba(25,45,75,.08)}.hero{padding:20px;margin:18px 0}.meta{color:var(--muted);margin-top:7px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:17px}.stat{padding:14px;border:1px solid var(--line);border-radius:14px}.stat span{display:block;color:var(--muted);font-size:13px}.stat strong{font-size:26px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.btn{border:1px solid var(--line);background:white;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}.grid{display:grid;grid-template-columns:370px 1fr;gap:16px}.head{padding:15px;border-bottom:1px solid var(--line)}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px}.filters{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.filters button{border:1px solid var(--line);background:white;border-radius:999px;padding:7px 10px;cursor:pointer}.filters .active{background:#e8f0fb;color:var(--blue);font-weight:800}.list{padding:10px;display:grid;gap:8px}.player{padding:12px;border:1px solid transparent;border-radius:14px;background:#f7f9fc;cursor:pointer}.player.active{border-color:#8ba8d2;background:#eaf1fb}.player small{color:var(--muted)}.pill{float:right;font-size:11px;padding:5px 8px;border-radius:999px}.done{background:#e5f5ec;color:var(--green)}.pending{background:#fff2d6;color:var(--amber)}.detail{padding:20px}.profile{display:flex;justify-content:space-between;gap:12px;align-items:start;padding-bottom:15px;border-bottom:1px solid var(--line)}.profile h2{margin:0}.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}.info,.task{border:1px solid var(--line);border-radius:13px;padding:12px}.info span{display:block;color:var(--muted);font-size:12px}.tasks{display:grid;gap:9px}.task{display:flex;justify-content:space-between;align-items:center;gap:12px}.task button{border:1px solid var(--line);background:white;border-radius:10px;padding:8px 11px;font-weight:800;cursor:pointer}.task button.on{background:#e5f5ec;color:var(--green)}.notes{width:100%;min-height:86px;margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px}.modal{position:fixed;inset:0;background:rgba(20,30,45,.55);display:none;place-items:center;padding:18px}.modal.show{display:grid}.modal-card{width:min(560px,100%);background:white;border-radius:18px;padding:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{font-size:12px;color:var(--muted)}.form input,.form select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:4px}.full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.form{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="top"><div><div style="color:#6d788a">Eventi / Roma 2026</div><h1>Talent ID Camp Roma</h1></div><div class="badge">ANTEPRIMA · NON PUBBLICATA</div></div><section class="hero"><strong>FIL-EURO Talent ID Camp</strong><div class="meta">📅 5 agosto 2026 · 15:00–20:00 &nbsp; 📍 Stella Azzurra Roma</div><div class="stats"><div class="stat"><span>Iscritti</span><strong id="s1"></strong></div><div class="stat"><span>Pagati</span><strong id="s2"></strong></div><div class="stat"><span>Check-in</span><strong id="s3"></strong></div><div class="stat"><span>Maglie consegnate</span><strong id="s4"></strong></div></div></section><div class="toolbar"><button class="btn primary" onclick="openEdit()">✎ Modifica giocatore</button><button class="btn" onclick="sendMail()">✉️ Prepara email</button><button class="btn" onclick="resetDemo()">↺ Ripristina demo</button></div><section class="grid"><div class="panel"><div class="head"><input id="search" class="search" placeholder="Cerca giocatore, email, categoria..."><div class="filters"><button class="active" data-f="all">Tutti</button><button data-f="pending">Da pagare</button><button data-f="checked">Arrivati</button><button data-f="U12">U12</button><button data-f="U16">U16</button></div></div><div id="list" class="list"></div></div><div id="detail" class="panel"></div></section></div><div id="modal" class="modal"><div class="modal-card"><h2>Modifica partecipante</h2><div class="form"><label>Nome<input id="fName"></label><label>Anno<input id="fYear"></label><label>Categoria<select id="fCat"><option>U12</option><option>U14</option><option>U16</option><option>U18</option><option>U19</option></select></label><label>Taglia<select id="fShirt"><option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option></select></label><label class="full">Email<input id="fEmail"></label><label class="full">Genitore<input id="fParent"></label></div><div class="modal-actions"><button class="btn" onclick="closeEdit()">Annulla</button><button class="btn primary" onclick="saveEdit()">Salva modifiche</button></div></div></div><script src="data/admin-registrations-roma.js"></script><script>const seed=window.FILITALIA_ADMIN_REGISTRATIONS||[];let data=JSON.parse(localStorage.getItem('filRomaFase2')||'null')||JSON.parse(JSON.stringify(seed)),selected=data[0]?.id||null,filter='all';const save=()=>localStorage.setItem('filRomaFase2',JSON.stringify(data));function render(){const q=search.value.toLowerCase();const rows=data.filter(p=>(filter==='all'||filter===p.cat||filter===p.status||(filter==='checked'&&p.checked))&&`${p.name} ${p.email} ${p.cat} ${p.year}`.toLowerCase().includes(q));list.innerHTML=rows.map(p=>`<div class="player ${p.id===selected?'active':''}" onclick="selectP(${p.id})"><span class="pill ${p.checked?'done':'pending'}">${p.checked?'Arrivato':'Da registrare'}</span><strong>${p.name}</strong><br><small>${p.cat} · ${p.year} · Maglia ${p.shirt}</small></div>`).join('')||'<div style="padding:30px;color:#6d788a">Nessun risultato</div>';const p=data.find(x=>x.id===selected)||data[0];detail.innerHTML=p?`<div class="detail"><div class="profile"><div><h2>${p.name}</h2><div style="color:#6d788a">${p.cat} · ${p.year} · ${p.status==='paid'?'Pagamento verificato':'Pagamento in attesa'}</div></div><button class="btn" onclick="openEdit()">Modifica</button></div><div class="info-grid"><div class="info"><span>Email</span><strong>${p.email}</strong></div><div class="info"><span>Genitore</span><strong>${p.parent}</strong></div><div class="info"><span>Taglia</span><strong>${p.shirt}</strong></div><div class="info"><span>Certificato</span><strong>${p.certificate?'Presente':'Mancante'}</strong></div></div><div class="tasks">${task(p,'status','Pagamento verificato','paid')}${task(p,'certificate','Certificato medico')}${task(p,'checked','Check-in')}${task(p,'shirtDone','Maglia consegnata')}${task(p,'present','Presenza confermata')}</div><textarea class="notes" onchange="note(${p.id},this.value)" placeholder="Note rapide...">${p.notes||''}</textarea></div>`:'<div class="detail">Nessun partecipante</div>';s1.textContent=data.length;s2.textContent=data.filter(x=>x.status==='paid').length;s3.textContent=data.filter(x=>x.checked).length;s4.textContent=data.filter(x=>x.shirtDone).length}function task(p,key,label,paidValue){const on=paidValue?p[key]===paidValue:p[key];return `<div class="task"><strong>${label}</strong><button class="${on?'on':''}" onclick="toggle(${p.id},'${key}'${paidValue?`,'${paidValue}'`:''})">${on?'✓ Fatto':'Segna fatto'}</button></div>`}function selectP(id){selected=id;render()}function toggle(id,key,paidValue){const p=data.find(x=>x.id===id);p[key]=paidValue?(p[key]===paidValue?'pending':paidValue):!p[key];save();render()}function note(id,v){data.find(x=>x.id===id).notes=v;save()}function openEdit(){const p=data.find(x=>x.id===selected);fName.value=p.name;fYear.value=p.year;fCat.value=p.cat;fShirt.value=p.shirt;fEmail.value=p.email;fParent.value=p.parent;modal.classList.add('show')}function closeEdit(){modal.classList.remove('show')}function saveEdit(){const p=data.find(x=>x.id===selected);p.name=fName.value.trim()||p.name;p.year=fYear.value.trim()||p.year;p.cat=fCat.value;p.shirt=fShirt.value;p.email=fEmail.value.trim();p.parent=fParent.value.trim();save();closeEdit();render()}function sendMail(){const p=data.find(x=>x.id===selected);location.href=`mailto:${encodeURIComponent(p.email)}?subject=${encodeURIComponent('FIL-ITALIA · Talent ID Camp Roma')}&body=${encodeURIComponent('Ciao '+p.name+',\n\nqui puoi inserire la comunicazione relativa al camp di Roma.\n\nFIL-ITALIA Nation Select')}`}function resetDemo(){localStorage.removeItem('filRomaFase2');data=JSON.parse(JSON.stringify(seed));selected=data[0]?.id||null;render()}search.oninput=render;document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;render()});render();</script></body></html>
