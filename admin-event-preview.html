<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIL-ITALIA Admin · Evento Roma</title>
<style>
:root{--bg:#e9eef5;--side:#dce6f1;--card:#fffdf8;--ink:#17233a;--muted:#69758a;--line:#cbd6e3;--blue:#274f8f;--blue2:#e7eef9;--green:#16774a;--greenbg:#e5f5ec;--amber:#9a6410;--amberbg:#fff3d6;--red:#a33b42;--redbg:#fdebed;--shadow:0 14px 40px rgba(32,54,87,.09)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:var(--side);border-right:1px solid var(--line);padding:24px 18px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:12px;align-items:center;margin:0 8px 30px}.logo{width:42px;height:42px;border-radius:14px;background:var(--blue);display:grid;place-items:center;color:white;font-weight:900}.brand strong{display:block}.brand small{color:var(--muted)}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:12px;color:#445168;cursor:pointer}.nav button.active,.nav button:hover{background:rgba(255,255,255,.7);color:var(--blue);font-weight:750}.sidebar-foot{position:absolute;bottom:22px;left:18px;right:18px;background:rgba(255,255,255,.55);border:1px solid var(--line);padding:12px;border-radius:14px;font-size:13px;color:var(--muted)}.main{padding:28px}.topbar{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:22px}.crumb{font-size:14px;color:var(--muted)}h1{font-size:30px;margin:5px 0 0;letter-spacing:-.7px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--card);padding:10px 14px;border-radius:11px;cursor:pointer;color:var(--ink);font-weight:700}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.event-head{background:linear-gradient(135deg,#fffdf8,#eef4fb);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}.event-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);margin-top:10px;font-size:14px}.status{background:var(--greenbg);color:var(--green);padding:8px 11px;border-radius:999px;font-size:13px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}.stat{background:rgba(255,255,255,.72);border:1px solid var(--line);padding:15px;border-radius:15px}.stat span{display:block;color:var(--muted);font-size:13px}.stat strong{font-size:25px}.progress{height:9px;background:#dfe6ef;border-radius:999px;overflow:hidden;margin-top:17px}.progress i{display:block;height:100%;width:72%;background:var(--blue);border-radius:inherit}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.tab{white-space:nowrap;border:1px solid var(--line);background:rgba(255,255,255,.55);padding:10px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:700}.tab.active{background:var(--blue);color:white;border-color:var(--blue)}.workspace{display:grid;grid-template-columns:minmax(310px,420px) 1fr;gap:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.panel-head{padding:18px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font-size:18px}.search{margin-top:13px;display:flex;gap:8px}.search input{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:white}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.filter{border:1px solid var(--line);background:white;padding:7px 10px;border-radius:999px;font-size:12px;cursor:pointer}.filter.active{background:var(--blue2);border-color:#91a9ce;color:var(--blue);font-weight:800}.players{padding:10px;display:grid;gap:8px;max-height:610px;overflow:auto}.player{border:1px solid transparent;background:#f8fafc;border-radius:14px;padding:13px;cursor:pointer;display:grid;grid-template-columns:42px 1fr auto;gap:11px;align-items:center}.player:hover,.player.active{border-color:#91a9ce;background:var(--blue2)}.avatar{width:42px;height:42px;border-radius:13px;background:#d7e0eb;display:grid;place-items:center;font-weight:900;color:var(--blue)}.player strong{display:block}.player small{color:var(--muted)}.pill{font-size:11px;padding:5px 8px;border-radius:999px;font-weight:800}.paid{background:var(--greenbg);color:var(--green)}.pending{background:var(--amberbg);color:var(--amber)}.detail{padding:22px}.profile{display:flex;gap:15px;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line)}.profile .avatar{width:62px;height:62px;border-radius:18px;font-size:20px}.profile h2{margin:0 0 4px}.profile p{margin:0;color:var(--muted)}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin:18px 0}.info{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fbfcfe}.info span{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.info strong{font-size:14px}.checklist{display:grid;gap:9px;margin:18px 0}.check{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);padding:12px;border-radius:12px}.detail-actions{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:50px;text-align:center;color:var(--muted)}.toast{position:fixed;right:24px;bottom:24px;background:#17233a;color:white;padding:13px 16px;border-radius:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(12px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:980px){.app{grid-template-columns:82px 1fr}.sidebar{padding:18px 10px}.brand div,.nav button span,.sidebar-foot{display:none}.brand{justify-content:center;margin:0 0 24px}.nav button{text-align:center}.workspace{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.app{display:block}.sidebar{position:static;height:auto;display:flex;align-items:center;gap:10px;overflow:auto}.brand{margin:0}.nav{display:flex}.main{padding:16px}.topbar,.event-top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.detail-grid{grid-template-columns:1fr}.actions{width:100%}.actions .btn{flex:1}.workspace{gap:12px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="logo">FI</div><div><strong>FIL-ITALIA</strong><small>Management</small></div></div>
  <nav class="nav">
    <button><span>⌂ Dashboard</span></button>
    <button class="active"><span>🏀 Eventi</span></button>
    <button><span>👥 Giocatori</span></button>
    <button><span>📝 Registrazioni</span></button>
    <button><span>✉️ Email</span></button>
    <button><span>💳 Pagamenti</span></button>
    <button><span>📰 News</span></button>
    <button><span>⚙️ Impostazioni</span></button>
  </nav>
  <div class="sidebar-foot">Anteprima Fase 1<br><strong>Centro operativo evento</strong></div>
</aside>
<main class="main">
  <div class="topbar">
    <div><div class="crumb">Eventi / Roma 2026</div><h1>Talent ID Camp Roma</h1></div>
    <div class="actions"><button class="btn" onclick="toast('Anteprima pubblica aperta')">👁 Anteprima</button><button class="btn primary" onclick="toast('Evento pronto per la pubblicazione')">Pubblica</button></div>
  </div>
  <section class="event-head">
    <div class="event-top"><div><strong>FIL-EURO Talent ID Camp</strong><div class="meta"><span>📅 5 agosto 2026 · 15:00–20:00</span><span>📍 Palestra Stella Azzurra, Roma</span><span>🆔 EVT-2026-ROMA-001</span></div></div><span class="status">● Pubblicato</span></div>
    <div class="stats"><div class="stat"><span>Iscritti</span><strong>43</strong></div><div class="stat"><span>Pagamenti</span><strong>31</strong></div><div class="stat"><span>Email inviate</span><strong>38</strong></div><div class="stat"><span>Check-in</span><strong>0</strong></div></div>
    <div class="progress"><i></i></div>
  </section>
  <div class="tabs"><button class="tab">Informazioni</button><button class="tab active">Registrazioni</button><button class="tab">Pagamenti</button><button class="tab">Email</button><button class="tab">Gallery</button><button class="tab">News</button><button class="tab">Documenti</button><button class="tab">Anteprima</button></div>
  <section class="workspace">
    <div class="panel">
      <div class="panel-head"><h2>Registrazioni</h2><div class="search"><input id="search" placeholder="Cerca nome, categoria o anno…"></div><div class="filters"><button class="filter active" data-filter="all">Tutti</button><button class="filter" data-filter="paid">Pagati</button><button class="filter" data-filter="pending">Da pagare</button><button class="filter" data-filter="U12">U12</button><button class="filter" data-filter="U14">U14</button><button class="filter" data-filter="U16">U16</button><button class="filter" data-filter="U18">U18</button></div></div>
      <div class="players" id="players"></div>
    </div>
    <div class="panel" id="detail"></div>
  </section>
</main>
</div>
<div class="toast" id="toast"></div>
<script>
const data=[
{id:1,name:'Marco Rossi',year:'2011',cat:'U16',status:'paid',shirt:'XL',email:'marco.rossi@email.it',phone:'+39 333 1234567',parent:'Andrea Rossi',nation:'Italia',eligible:'Sì',medical:'Caricato',checkin:'Non arrivato'},
{id:2,name:'Luca Bianchi',year:'2013',cat:'U14',status:'pending',shirt:'M',email:'famiglia.bianchi@email.it',phone:'+39 334 2228899',parent:'Paolo Bianchi',nation:'Italia',eligible:'Da verificare',medical:'Mancante',checkin:'Non arrivato'},
{id:3,name:'David Panopio',year:'2010',cat:'U16',status:'paid',shirt:'L',email:'d.panopio@email.it',phone:'+39 339 4382211',parent:'Maria Panopio',nation:'Italia / Filippine',eligible:'Sì',medical:'Caricato',checkin:'Non arrivato'},
{id:4,name:'Jayson Mendoza',year:'2014',cat:'U12',status:'paid',shirt:'S',email:'mendoza.family@email.it',phone:'+39 347 2389001',parent:'Carlo Mendoza',nation:'Italia / Filippine',eligible:'Sì',medical:'Non richiesto',checkin:'Non arrivato'},
{id:5,name:'Nico De Luca',year:'2009',cat:'U18',status:'pending',shirt:'XL',email:'nico.deluca@email.it',phone:'+39 320 6819002',parent:'Elena De Luca',nation:'Italia',eligible:'No',medical:'Caricato',checkin:'Non arrivato'}];
let selected=1,filter='all';
const initials=n=>n.split(' ').map(x=>x[0]).slice(0,2).join('');
function renderList(){const q=document.getElementById('search').value.toLowerCase();const list=data.filter(p=>(filter==='all'||p.status===filter||p.cat===filter)&&(`${p.name} ${p.year} ${p.cat}`.toLowerCase().includes(q)));document.getElementById('players').innerHTML=list.length?list.map(p=>`<div class="player ${p.id===selected?'active':''}" onclick="selectPlayer(${p.id})"><div class="avatar">${initials(p.name)}</div><div><strong>${p.name}</strong><small>${p.cat} · ${p.year} · Maglia ${p.shirt}</small></div><span class="pill ${p.status}">${p.status==='paid'?'Pagato':'Da pagare'}</span></div>`).join(''):'<div class="empty">Nessun giocatore trovato</div>'}
function renderDetail(){const p=data.find(x=>x.id===selected);document.getElementById('detail').innerHTML=`<div class="detail"><div class="profile"><div class="avatar">${initials(p.name)}</div><div><h2>${p.name}</h2><p>${p.cat} · ${p.year} · ${p.nation}</p></div></div><div class="detail-grid"><div class="info"><span>Email</span><strong>${p.email}</strong></div><div class="info"><span>Telefono</span><strong>${p.phone}</strong></div><div class="info"><span>Genitore</span><strong>${p.parent}</strong></div><div class="info"><span>Maglia</span><strong>${p.shirt}</strong></div><div class="info"><span>Philippines Eligible</span><strong>${p.eligible}</strong></div><div class="info"><span>Certificato medico</span><strong>${p.medical}</strong></div></div><div class="checklist"><div class="check"><span>Pagamento</span><span class="pill ${p.status}">${p.status==='paid'?'Verificato':'In attesa'}</span></div><div class="check"><span>Email conferma</span><span class="pill paid">Inviata</span></div><div class="check"><span>Check-in</span><strong>${p.checkin}</strong></div></div><div class="detail-actions"><button class="btn" onclick="toast('Email pronta per ${p.name}')">✉️ Email</button><button class="btn" onclick="toast('Scheda modifica aperta')">✏️ Modifica</button><button class="btn" onclick="togglePayment(${p.id})">💳 ${p.status==='paid'?'Segna non pagato':'Segna pagato'}</button><button class="btn" onclick="toast('Player Card aperta')">📄 Player Card</button></div></div>`}
function selectPlayer(id){selected=id;renderList();renderDetail()}
function togglePayment(id){const p=data.find(x=>x.id===id);p.status=p.status==='paid'?'pending':'paid';renderList();renderDetail();toast('Stato pagamento aggiornato')}
document.getElementById('search').addEventListener('input',renderList);document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;renderList()});function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}renderList();renderDetail();
</script>
</body>
</html>
